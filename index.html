<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17303A">
<title>HomePlan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HomePlan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F3F7F6; --superficie:#FFFFFF; --tinta:#17303A; --tinta-suave:#5B7079;
  --azulejo:#D7ECEF; --linea:#DDE6E6; --menta:#2E9E6B; --menta-suave:#DDF2E6;
  --sol:#FFC93C; --alerta:#D9483B; --alerta-suave:#FBE3E0;
  --ivan:#2F6FDB; --jen:#C2449A;
  --radio:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#0E1C21; --superficie:#16272D; --tinta:#E6F0F1; --tinta-suave:#9AB0B6;
    --azulejo:#1D3A41; --linea:#24393F; --menta:#3DBB82; --menta-suave:#173A2B;
    --sol:#FFD25C; --alerta:#F06A5C; --alerta-suave:#3A1F1C;
    --ivan:#6C9BF0; --jen:#E07BC0;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
.hidden{display:none!important}

/* Estructura */
#app{max-width:640px;margin:0 auto;min-height:100%;padding:0 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.marca{font-weight:900;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.marca .tejado{width:26px;height:26px}
.ver{font-size:.75rem;font-weight:800;color:var(--tinta-suave);background:var(--azulejo);border-radius:999px;padding:2px 8px;margin-left:2px}
.yo{border:0;background:var(--azulejo);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--superficie);border-top:1px solid var(--linea);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:.78rem;font-weight:700;color:var(--tinta-suave);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--tinta)}
nav.tabs button[aria-current="page"] svg{color:var(--menta)}

/* Cabecera de Hoy: el elemento protagonista */
.hoy-cab{margin:10px 0 18px;padding:18px 18px 16px;background:var(--azulejo);border-radius:22px;position:relative;overflow:hidden}
.hoy-cab .dia{font-weight:900;font-size:2.1rem;line-height:1.05;letter-spacing:-.03em;margin:0}
.hoy-cab .fecha{color:var(--tinta-suave);font-weight:700;margin:4px 0 14px}
.barra{height:12px;background:var(--superficie);border-radius:999px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--menta);border-radius:999px;transition:width .4s ease}
.hoy-cab .cuenta{margin-top:8px;font-weight:700;font-size:.95rem}

h2{font-size:1.05rem;font-weight:800;margin:22px 0 8px}
h2 .n{color:var(--tinta-suave);font-weight:700}
.vacio{color:var(--tinta-suave);background:var(--superficie);border:1px dashed var(--linea);border-radius:var(--radio);padding:16px;text-align:center}

/* Filas de tarea */
.lista{display:flex;flex-direction:column;gap:8px}
.fila{display:flex;gap:12px;align-items:flex-start;background:var(--superficie);border-radius:var(--radio);padding:12px;border:1px solid var(--linea)}
.fila.atrasada{border-color:var(--alerta);background:linear-gradient(90deg,var(--alerta-suave),var(--superficie) 40%)}
.fila.hecha .nombre{text-decoration:line-through;color:var(--tinta-suave)}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--menta);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:18px;height:18px;opacity:0;color:#fff}
.check.lleno{background:var(--menta)}
.check.lleno svg{opacity:1}
.check.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.check.futuro{border-style:dashed;border-color:var(--linea)}
.info{flex:1;min-width:0;cursor:pointer}
.nombre{font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.84rem;color:var(--tinta-suave);margin-top:3px;align-items:center}
.cat{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--tinta)}
.cat::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.persona{font-weight:800;border-radius:999px;padding:1px 8px;font-size:.78rem;color:#fff;background:var(--p)}
.rojo{color:var(--alerta);font-weight:800}

/* Controles */
.seg{display:flex;background:var(--superficie);border:1px solid var(--linea);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-weight:700;font-size:.9rem;color:var(--tinta-suave)}
.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filtros select{flex:1;min-width:130px}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;background:var(--superficie);border:1px solid var(--linea);border-radius:12px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--tinta);color:var(--papel)}
.btn.sec{background:var(--azulejo);color:var(--tinta)}
.btn.peligro{background:var(--alerta-suave);color:var(--alerta)}
.btn.ancho{width:100%}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--sol);color:#17303A;box-shadow:0 6px 18px rgba(23,48,58,.25);display:grid;place-items:center;z-index:11}
.fab svg{width:28px;height:28px}

/* Calendario */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.cal-nav .tit{font-weight:900;font-size:1.1rem;text-align:center;flex:1}
.icono{border:1px solid var(--linea);background:var(--superficie);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;padding:0}
.icono svg{width:20px;height:20px}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mes .dsem{text-align:center;font-size:.75rem;font-weight:800;color:var(--tinta-suave);padding:4px 0}
.celda{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;min-height:64px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:3px}
.celda.fuera{opacity:.45}
.celda.es-hoy{border:2px solid var(--sol)}
.celda .num{font-weight:800;font-size:.85rem}
.celda .marcas{display:flex;flex-wrap:wrap;gap:3px}
.celda .m{width:8px;height:8px;border-radius:50%;background:var(--c)}
.celda .m.ok{outline:2px solid var(--menta);outline-offset:1px}
.celda .mas{font-size:.7rem;font-weight:800;color:var(--tinta-suave)}
.semana-dia{margin-bottom:12px}
.semana-dia h3{font-size:.95rem;margin:14px 0 6px;font-weight:800}
.semana-dia h3.es-hoy{color:var(--menta)}

/* Hoja inferior (formularios) */
.sheet{position:fixed;inset:0;background:rgba(10,25,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--papel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:1.2rem;font-weight:900}
.campo{margin-bottom:14px}
.campo label,.campo .lbl{display:block;font-weight:800;font-size:.9rem;margin-bottom:6px}
.fila2{display:flex;gap:8px}
.fila2>*{flex:1}
.acciones{display:flex;gap:8px;margin-top:18px}
.acciones .btn{flex:1}
.cat-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cat-edit input[type=color]{width:44px;height:44px;border:1px solid var(--linea);border-radius:10px;padding:2px;background:var(--superficie)}

/* Aviso inferior */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--papel);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px);font-weight:700}
.toast button{border:0;background:var(--sol);color:#17303A;border-radius:10px;padding:6px 10px;font-weight:800}

/* Pantallas de acceso */
.acceso{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:24px}
.acceso .tejado{width:84px;height:84px}
.acceso h1{font-size:2.4rem;font-weight:900;letter-spacing:-.03em;margin:0}
.acceso p{color:var(--tinta-suave);max-width:32ch;margin:0}
.eleccion{display:flex;gap:12px;margin-top:6px}
.eleccion button{border:0;border-radius:18px;padding:18px 26px;font-weight:900;font-size:1.2rem;color:#fff}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="acceso"><p>Cargando…</p></div></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script type="module">
/* =====================================================================
   HomePlan v1.0
   ---------------------------------------------------------------------
   1) PEGA AQUÍ tu firebaseConfig (el bloque que te dio la consola).
   2) Si la consola te mostró otra versión en las URLs de gstatic
      (…/firebasejs/X.Y.Z/…), cambia FIREBASE_VERSION por ese número.
   ===================================================================== */
const FIREBASE_VERSION = '12.19.0';
const firebaseConfig = {
  apiKey: "AIzaSyArov2KoFakhjdynfteXKfvGChU1nD40fs",
  authDomain: "homeplan-496cf.firebaseapp.com",
  projectId: "homeplan-496cf",
  storageBucket: "homeplan-496cf.firebasestorage.app",
  messagingSenderId: "818389477523",
  appId: "1:818389477523:web:5352b908d26c50d72a4566",
  measurementId: "G-G3KRG9DN75"
};

const VERSION_APP = '1.2';
const PERSONAS = {
  ivan: { nombre: 'Iván', color: 'var(--ivan)' },
  jen:  { nombre: 'Jen',  color: 'var(--jen)' }
};
const CATEGORIAS_INICIALES = [
  { id: 'casa',    nombre: 'Casa',    color: '#2E9E6B' },
  { id: 'cocina',  nombre: 'Cocina',  color: '#E8912D' },
  { id: 'bano',    nombre: 'Baño',    color: '#2FA3C4' },
  { id: 'ropa',    nombre: 'Ropa',    color: '#8A63D2' },
  { id: 'compras', nombre: 'Compras', color: '#D9483B' }
];

/* ---------- Iconos ---------- */
const I = {
  tejado: '<svg class="tejado" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 23 24 8l18 15" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21v17a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3V21" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="m18 30 4.5 4.5L31 26" fill="none" stroke="#2E9E6B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ok: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  hoy: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  cal: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  yo: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4.5 20.5c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  lista: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="4.5" cy="6.5" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1.4" fill="currentColor"/></svg>',
  hist: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4.5l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  mas: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>',
  izq: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  der: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ---------- Utilidades de fecha (fechas locales como 'AAAA-MM-DD') ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const aFecha = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoy = () => ymd(new Date());
function sumarDias(s, n) { const d = aFecha(s); d.setDate(d.getDate() + n); return ymd(d); }
function sumarMeses(s, n) {
  const d = aFecha(s), dia = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const ultimo = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(dia, ultimo));
  return ymd(t);
}
/* Fecha de la repetición número i contando desde s (i=0 es s) */
function paso(s, f, i) {
  const n = Math.max(1, parseInt(f.cada, 10) || 1) * i;
  switch (f.tipo) {
    case 'dias': return sumarDias(s, n);
    case 'semanas': return sumarDias(s, 7 * n);
    case 'meses': return sumarMeses(s, n);
    case 'anios': return sumarMeses(s, 12 * n);
    default: return i === 0 ? s : null;
  }
}
const lunesDe = s => { const d = aFecha(s); const w = (d.getDay() + 6) % 7; return sumarDias(s, -w); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = (s, o) => cap(new Intl.DateTimeFormat('es-ES', o).format(aFecha(s)));
const fechaLarga = s => fmt(s, { weekday: 'long', day: 'numeric', month: 'long' });
const fechaCorta = s => fmt(s, { day: 'numeric', month: 'short' });
function fechaRelativa(s) {
  const h = hoy();
  if (s === h) return 'Hoy';
  if (s === sumarDias(h, 1)) return 'Mañana';
  if (s === sumarDias(h, -1)) return 'Ayer';
  return fechaCorta(s);
}
function textoFrecuencia(f) {
  if (!f || f.tipo === 'una') return 'Una vez';
  const n = Math.max(1, parseInt(f.cada, 10) || 1);
  const uno = { dias: 'Cada día', semanas: 'Cada semana', meses: 'Cada mes', anios: 'Cada año' };
  const varios = { dias: 'días', semanas: 'semanas', meses: 'meses', anios: 'años' };
  return n === 1 ? uno[f.tipo] : `Cada ${n} ${varios[f.tipo]}`;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Estado ---------- */
const S = {
  usuario: null, yo: null, tareas: [], categorias: [], registro: [],
  vista: 'hoy', hoySolo: 'todas',
  cal: { modo: 'semana', fecha: hoy(), persona: 'todos', categoria: 'todas' },
  lista: { persona: 'todos', categoria: 'todas' },
  hist: { persona: 'todos' },
  error: null
};
let FB = null, db = null, auth = null, desuscribir = [];

const app = document.getElementById('app');
const sheet = document.getElementById('sheet');
const toastEl = document.getElementById('toast');

/* ---------- Arranque de Firebase ---------- */
async function iniciar() {
  if (Object.values(firebaseConfig).some(v => v === 'PEGA_AQUI')) {
    app.innerHTML = `<div class="acceso">${I.tejado}<h1>HomePlan</h1><p>Falta pegar el bloque firebaseConfig al principio del código de index.html.</p></div>`;
    return;
  }
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  try {
    const [a, au, fs] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`)
    ]);
    FB = { ...a, ...au, ...fs };
  } catch (e) {
    app.innerHTML = `<div class="acceso">${I.tejado}<h1>HomePlan</h1><p>No se pudo cargar Firebase. Comprueba la conexión y que FIREBASE_VERSION coincide con la de la consola.</p></div>`;
    console.error(e);
    return;
  }
  const fbApp = FB.initializeApp(firebaseConfig);
  auth = FB.getAuth(fbApp);
  try {
    db = FB.initializeFirestore(fbApp, {
      localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() })
    });
  } catch (e) {
    console.warn('Caché sin conexión no disponible, sigo sin ella', e);
    db = FB.getFirestore(fbApp);
  }
  FB.onAuthStateChanged(auth, usuario => {
    desuscribir.forEach(f => f()); desuscribir = [];
    S.usuario = usuario; S.yo = null; S.error = null;
    if (!usuario) return pintarLogin();
    escucharPerfil();
  });
}

function pintarLogin(mensaje) {
  app.innerHTML = `<div class="acceso">${I.tejado}<h1>HomePlan</h1>
    <p>Las tareas de casa, repartidas y al día.</p>
    ${mensaje ? `<p class="rojo">${esc(mensaje)}</p>` : ''}
    <button class="btn" id="entrar">Entrar con Google</button></div>`;
  document.getElementById('entrar').onclick = async () => {
    try { await FB.signInWithPopup(auth, new FB.GoogleAuthProvider()); }
    catch (e) { console.error(e); pintarLogin('No se pudo iniciar sesión. Inténtalo de nuevo.'); }
  };
}

function sinAcceso() {
  desuscribir.forEach(f => f()); desuscribir = [];
  app.innerHTML = `<div class="acceso">${I.tejado}<h1>HomePlan</h1>
    <p>La cuenta ${esc(S.usuario?.email)} no tiene acceso a HomePlan.</p>
    <button class="btn sec" id="salir">Usar otra cuenta</button></div>`;
  document.getElementById('salir').onclick = () => FB.signOut(auth);
}

function alError(e) {
  console.error(e);
  if (e && e.code === 'permission-denied') sinAcceso();
}

function escucharPerfil() {
  const ref = FB.doc(db, 'perfiles', S.usuario.uid);
  desuscribir.push(FB.onSnapshot(ref, snap => {
    if (!snap.exists()) {
      if (snap.metadata.fromCache) return;
      return pintarEleccion();
    }
    const nuevo = snap.data().persona;
    const primera = !S.yo;
    S.yo = nuevo;
    if (primera) escucharDatos(); else pintar();
  }, alError));
}

function pintarEleccion() {
  app.innerHTML = `<div class="acceso">${I.tejado}<h1>¿Quién eres?</h1>
    <p>Solo se pregunta una vez en este dispositivo y cuenta.</p>
    <div class="eleccion">
      <button data-p="ivan" style="background:var(--ivan)">Iván</button>
      <button data-p="jen" style="background:var(--jen)">Jen</button>
    </div></div>`;
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    FB.setDoc(FB.doc(db, 'perfiles', S.usuario.uid), { persona: b.dataset.p, email: S.usuario.email }).catch(alError);
  });
}

function escucharDatos() {
  desuscribir.push(FB.onSnapshot(FB.collection(db, 'tareas'), snap => {
    S.tareas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    pintar();
  }, alError));
  desuscribir.push(FB.onSnapshot(FB.collection(db, 'categorias'), snap => {
    if (snap.empty && !snap.metadata.fromCache) {
      CATEGORIAS_INICIALES.forEach(c =>
        FB.setDoc(FB.doc(db, 'categorias', c.id), { nombre: c.nombre, color: c.color }, { merge: true }).catch(alError));
    }
    S.categorias = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    pintar();
  }, alError));
  const q = FB.query(FB.collection(db, 'registro'), FB.orderBy('fecha', 'desc'), FB.limit(300));
  desuscribir.push(FB.onSnapshot(q, snap => {
    S.registro = snap.docs.map(d => {
      const x = d.data({ serverTimestamps: 'estimate' });
      return { id: d.id, ...x, _ts: x.ts?.toMillis?.() ?? Date.now() };
    }).sort((a, b) => a.fecha === b.fecha ? b._ts - a._ts : (a.fecha < b.fecha ? 1 : -1));
    pintar();
  }, alError));
}

/* ---------- Lógica de tareas ---------- */
const responsableEfectivo = t => t.responsable === 'alternar' ? (t.turno || 'ivan') : t.responsable;
const esDe = (t, p) => { const r = responsableEfectivo(t); return r === p || r === 'ambos'; };
const categoria = id => S.categorias.find(c => c.id === id) || { nombre: 'Sin categoría', color: '#9AA7AB' };
const activas = () => S.tareas.filter(t => t.activa !== false && t.proxima);
const hechasHoy = () => S.registro.filter(r => r.fecha === hoy());

function pasaFiltro(t, f) {
  if (f.persona && f.persona !== 'todos' && !esDe(t, f.persona)) return false;
  if (f.categoria && f.categoria !== 'todas' && t.categoriaId !== f.categoria) return false;
  return true;
}
function registroPasaFiltro(r, f) {
  if (f.persona && f.persona !== 'todos' && r.hechaPor !== f.persona) return false;
  if (f.categoria && f.categoria !== 'todas' && r.categoriaId !== f.categoria) return false;
  return true;
}

/* Repeticiones previstas entre dos fechas (a partir de la próxima fecha) */
function ocurrencias(desde, hasta, filtro) {
  const mapa = {};
  const meter = (d, t, siguiente) => (mapa[d] ||= []).push({ t, siguiente });
  for (const t of activas()) {
    if (!pasaFiltro(t, filtro)) continue;
    if (!t.frecuencia || t.frecuencia.tipo === 'una') {
      if (t.proxima >= desde && t.proxima <= hasta) meter(t.proxima, t, true);
      continue;
    }
    for (let i = 0; i < 800; i++) {
      const d = paso(t.proxima, t.frecuencia, i);
      if (!d || d > hasta) break;
      if (d >= desde) meter(d, t, i === 0);
    }
  }
  return mapa;
}

function completar(id, boton, fecha, quien) {
  const t = S.tareas.find(x => x.id === id);
  if (!t) return;
  if (boton) { boton.classList.add('lleno', 'pop'); }
  const f = fecha || hoy();
  const hechaPor = quien || S.yo;
  const lote = FB.writeBatch(db);
  const refReg = FB.doc(FB.collection(db, 'registro'));
  lote.set(refReg, {
    tareaId: id, nombre: t.nombre, categoriaId: t.categoriaId || null,
    hechaPor, prevista: t.proxima, fecha: f, ts: FB.serverTimestamp()
  });
  const antes = { proxima: t.proxima, activa: t.activa !== false, turno: t.turno || null };
  const cambios = {};
  if (!t.frecuencia || t.frecuencia.tipo === 'una') cambios.activa = false;
  else cambios.proxima = paso(f, t.frecuencia, 1); // la siguiente cuenta desde el día en que se hace
  if (t.responsable === 'alternar') cambios.turno = hechaPor === 'ivan' ? 'jen' : 'ivan';
  lote.update(FB.doc(db, 'tareas', id), cambios);
  lote.commit().catch(alError);
  avisar(f === hoy() ? `${t.nombre}: hecha` : `${t.nombre}: hecha el ${fechaCorta(f)}`, 'Deshacer', () => {
    const l = FB.writeBatch(db);
    l.delete(refReg);
    l.update(FB.doc(db, 'tareas', id), antes);
    l.commit().catch(alError);
  });
}

/* ---------- Aviso con deshacer ---------- */
let temporizadorAviso = null;
function avisar(texto, accion, alPulsar) {
  clearTimeout(temporizadorAviso);
  toastEl.innerHTML = `<span>${esc(texto)}</span>${accion ? `<button>${esc(accion)}</button>` : ''}`;
  toastEl.classList.remove('hidden');
  if (accion) toastEl.querySelector('button').onclick = () => { alPulsar(); toastEl.classList.add('hidden'); };
  temporizadorAviso = setTimeout(() => toastEl.classList.add('hidden'), 6000);
}

/* ---------- Piezas de interfaz ---------- */
function etiquetaPersona(t) {
  const r = responsableEfectivo(t);
  if (r === 'ambos') return `<span class="persona" style="--p:var(--menta)">Ambos</span>`;
  const p = PERSONAS[r]; if (!p) return '';
  const extra = t.responsable === 'alternar' ? ' (turno)' : '';
  return `<span class="persona" style="--p:${p.color}">${p.nombre}${extra}</span>`;
}
function filaTarea(t, fecha, { siguiente = true, mostrarFecha = false } = {}) {
  const c = categoria(t.categoriaId);
  const atrasada = siguiente && fecha < hoy();
  const check = siguiente
    ? `<button class="check" data-completar="${t.id}" aria-label="Marcar ${esc(t.nombre)} como hecha">${I.ok}</button>`
    : `<span class="check futuro" aria-hidden="true"></span>`;
  return `<div class="fila${atrasada ? ' atrasada' : ''}">${check}
    <div class="info" data-editar="${t.id}">
      <div class="nombre">${esc(t.nombre)}</div>
      <div class="meta"><span class="cat" style="--c:${esc(c.color)}">${esc(c.nombre)}</span>${etiquetaPersona(t)}<span>${textoFrecuencia(t.frecuencia)}</span>
      ${mostrarFecha ? `<span class="${atrasada ? 'rojo' : ''}">${atrasada ? 'Tocaba ' : ''}${fechaRelativa(fecha)}</span>` : ''}</div>
    </div></div>`;
}
function filaHecha(r) {
  const c = categoria(r.categoriaId), p = PERSONAS[r.hechaPor];
  return `<div class="fila hecha"><span class="check lleno" aria-hidden="true">${I.ok}</span>
    <div class="info"><div class="nombre">${esc(r.nombre)}</div>
    <div class="meta"><span class="cat" style="--c:${esc(c.color)}">${esc(c.nombre)}</span>
    <span>Hecha por ${p ? p.nombre : '?'}${r.prevista && r.prevista < r.fecha ? `, tocaba ${fechaCorta(r.prevista)}` : ''}</span></div></div></div>`;
}
const listaHTML = (items, vacio) => items.length ? `<div class="lista">${items.join('')}</div>` : `<div class="vacio">${vacio}</div>`;
const opcionesPersona = sel => `<option value="todos"${sel === 'todos' ? ' selected' : ''}>Todos</option>` +
  Object.entries(PERSONAS).map(([k, p]) => `<option value="${k}"${sel === k ? ' selected' : ''}>${p.nombre}</option>`).join('');
const opcionesCategoria = sel => `<option value="todas">Todas las categorías</option>` +
  S.categorias.map(c => `<option value="${c.id}"${sel === c.id ? ' selected' : ''}>${esc(c.nombre)}</option>`).join('');

/* ---------- Pantallas ---------- */
function vistaHoy() {
  const h = hoy();
  const filtro = S.hoySolo === 'mias' ? { persona: S.yo } : {};
  const pend = activas().filter(t => t.proxima <= h && pasaFiltro(t, filtro)).sort((a, b) => a.proxima.localeCompare(b.proxima));
  const atrasadas = pend.filter(t => t.proxima < h);
  const deHoy = pend.filter(t => t.proxima === h);
  const hechas = hechasHoy().filter(r => S.hoySolo !== 'mias' || r.hechaPor === S.yo);
  const total = pend.length + hechas.length;
  const pct = total ? Math.round(hechas.length / total * 100) : 0;
  const d = new Date();
  return `<section class="hoy-cab">
      <p class="dia">${cap(new Intl.DateTimeFormat('es-ES', { weekday: 'long' }).format(d))}</p>
      <p class="fecha">${cap(new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }).format(d))}</p>
      <div class="barra" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <div class="cuenta">${total ? `${hechas.length} de ${total} hechas` : 'Hoy no toca nada'}</div>
    </section>
    <div class="seg" role="group" aria-label="Qué tareas ver">
      <button data-hoy="todas" aria-pressed="${S.hoySolo === 'todas'}">De los dos</button>
      <button data-hoy="mias" aria-pressed="${S.hoySolo === 'mias'}">Solo mías</button>
    </div>
    ${atrasadas.length ? `<h2>Atrasadas <span class="n">${atrasadas.length}</span></h2>${listaHTML(atrasadas.map(t => filaTarea(t, t.proxima, { mostrarFecha: true })), '')}` : ''}
    <h2>Para hoy <span class="n">${deHoy.length}</span></h2>
    ${listaHTML(deHoy.map(t => filaTarea(t, t.proxima)), 'Nada pendiente para hoy.')}
    ${hechas.length ? `<h2>Hechas hoy <span class="n">${hechas.length}</span></h2>${listaHTML(hechas.map(filaHecha), '')}` : ''}`;
}

function vistaMias() {
  const h = hoy(), en7 = sumarDias(h, 7);
  const mias = activas().filter(t => esDe(t, S.yo)).sort((a, b) => a.proxima.localeCompare(b.proxima));
  const ahora = mias.filter(t => t.proxima <= h);
  const semana = mias.filter(t => t.proxima > h && t.proxima <= en7);
  const luego = mias.filter(t => t.proxima > en7);
  const p = PERSONAS[S.yo];
  return `<h2 style="font-size:1.6rem;font-weight:900;margin-top:10px">Tareas de ${p ? p.nombre : ''}</h2>
    <p style="color:var(--tinta-suave);margin:0">Incluye las tuyas, las de ambos y las alternas cuando te toca.</p>
    <h2>Pendientes ahora <span class="n">${ahora.length}</span></h2>
    ${listaHTML(ahora.map(t => filaTarea(t, t.proxima, { mostrarFecha: true })), 'No tienes nada pendiente.')}
    <h2>Próximos 7 días <span class="n">${semana.length}</span></h2>
    ${listaHTML(semana.map(t => filaTarea(t, t.proxima, { mostrarFecha: true })), 'Semana despejada.')}
    <h2>Más adelante <span class="n">${luego.length}</span></h2>
    ${listaHTML(luego.map(t => filaTarea(t, t.proxima, { mostrarFecha: true })), 'Nada más programado.')}`;
}

function itemsDia(fecha, mapa, filtroReg) {
  const h = hoy();
  const items = [];
  if (fecha === h) {
    activas().filter(t => t.proxima < h && pasaFiltro(t, S.cal)).forEach(t => items.push(filaTarea(t, t.proxima, { mostrarFecha: true })));
  }
  (mapa[fecha] || []).forEach(o => items.push(filaTarea(o.t, fecha, { siguiente: o.siguiente })));
  S.registro.filter(r => r.fecha === fecha && registroPasaFiltro(r, filtroReg)).forEach(r => items.push(filaHecha(r)));
  return items;
}

function vistaCalendario() {
  const c = S.cal, h = hoy();
  const filtroReg = { persona: c.persona, categoria: c.categoria };
  let titulo = '', cuerpo = '';
  if (c.modo === 'dia') {
    titulo = fechaLarga(c.fecha);
    const mapa = ocurrencias(c.fecha, c.fecha, c);
    cuerpo = listaHTML(itemsDia(c.fecha, mapa, filtroReg), 'Nada este día.');
  } else if (c.modo === 'semana') {
    const ini = lunesDe(c.fecha), fin = sumarDias(ini, 6);
    titulo = `${fechaCorta(ini)} a ${fechaCorta(fin)}`;
    const mapa = ocurrencias(ini, fin, c);
    for (let i = 0; i < 7; i++) {
      const d = sumarDias(ini, i);
      const items = itemsDia(d, mapa, filtroReg);
      cuerpo += `<div class="semana-dia"><h3 class="${d === h ? 'es-hoy' : ''}">${fechaLarga(d)}</h3>${listaHTML(items, 'Libre.')}</div>`;
    }
  } else {
    const f = aFecha(c.fecha);
    const primero = ymd(new Date(f.getFullYear(), f.getMonth(), 1));
    const ultimo = ymd(new Date(f.getFullYear(), f.getMonth() + 1, 0));
    titulo = cap(new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(f));
    const ini = lunesDe(primero), fin = sumarDias(lunesDe(ultimo), 6);
    const mapa = ocurrencias(ini, fin, c);
    let celdas = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<div class="dsem">${x}</div>`).join('');
    for (let d = ini; d <= fin; d = sumarDias(d, 1)) {
      const prev = (mapa[d] || []).map(o => `<span class="m" style="--c:${esc(categoria(o.t.categoriaId).color)}"></span>`);
      const hechas = S.registro.filter(r => r.fecha === d && registroPasaFiltro(r, filtroReg))
        .map(r => `<span class="m ok" style="--c:${esc(categoria(r.categoriaId).color)}"></span>`);
      const todas = [...hechas, ...prev];
      const visibles = todas.slice(0, 6).join('') + (todas.length > 6 ? `<span class="mas">+${todas.length - 6}</span>` : '');
      celdas += `<button class="celda${d < primero || d > ultimo ? ' fuera' : ''}${d === h ? ' es-hoy' : ''}" data-dia="${d}" aria-label="${fechaLarga(d)}, ${todas.length} tareas">
        <span class="num">${aFecha(d).getDate()}</span><span class="marcas">${visibles}</span></button>`;
    }
    cuerpo = `<div class="mes">${celdas}</div><p style="color:var(--tinta-suave);font-size:.85rem">Los puntos con borde verde son tareas hechas. Toca un día para ver el detalle.</p>`;
  }
  return `<div class="seg" role="group" aria-label="Vista del calendario" style="margin-top:10px">
      ${['dia', 'semana', 'mes'].map(m => `<button data-modo="${m}" aria-pressed="${c.modo === m}">${{ dia: 'Día', semana: 'Semana', mes: 'Mes' }[m]}</button>`).join('')}
    </div>
    <div class="filtros">
      <select data-calfiltro="persona" aria-label="Filtrar por persona">${opcionesPersona(c.persona)}</select>
      <select data-calfiltro="categoria" aria-label="Filtrar por categoría">${opcionesCategoria(c.categoria)}</select>
    </div>
    <div class="cal-nav">
      <button class="icono" data-mover="-1" aria-label="Anterior">${I.izq}</button>
      <div class="tit">${titulo}</div>
      <button class="icono" data-mover="1" aria-label="Siguiente">${I.der}</button>
    </div>
    <button class="btn sec" data-irhoy style="padding:6px 12px;margin-bottom:10px">Ir a hoy</button>
    ${cuerpo}`;
}

function vistaTareas() {
  const f = S.lista;
  const lista = S.tareas.filter(t => pasaFiltro(t, f)).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  const act = lista.filter(t => t.activa !== false), fin = lista.filter(t => t.activa === false);
  return `<div class="filtros" style="margin-top:12px">
      <select data-listafiltro="persona" aria-label="Filtrar por persona">${opcionesPersona(f.persona)}</select>
      <select data-listafiltro="categoria" aria-label="Filtrar por categoría">${opcionesCategoria(f.categoria)}</select>
    </div>
    <button class="btn sec ancho" data-categorias>Gestionar categorías</button>
    <h2>Activas <span class="n">${act.length}</span></h2>
    ${listaHTML(act.map(t => filaTarea(t, t.proxima, { mostrarFecha: true })), 'Aún no hay tareas. Crea la primera con el botón amarillo.')}
    ${fin.length ? `<h2>Terminadas (de una sola vez) <span class="n">${fin.length}</span></h2>
      <div class="lista">${fin.map(t => `<div class="fila hecha"><span class="check lleno" aria-hidden="true">${I.ok}</span><div class="info" data-editar="${t.id}"><div class="nombre">${esc(t.nombre)}</div></div></div>`).join('')}</div>` : ''}`;
}

function vistaHistorial() {
  const regs = S.registro.filter(r => registroPasaFiltro(r, S.hist));
  let html = `<div class="filtros" style="margin-top:12px"><select data-histfiltro="persona" aria-label="Filtrar por persona">${opcionesPersona(S.hist.persona)}</select></div>`;
  if (!regs.length) return html + `<div class="vacio">Todavía no hay tareas hechas.</div>`;
  let dia = null;
  for (const r of regs) {
    if (r.fecha !== dia) { if (dia) html += '</div>'; dia = r.fecha; html += `<h2>${fechaLarga(dia)}</h2><div class="lista">`; }
    html += filaHecha(r);
  }
  html += '</div>';
  const cuenta = p => regs.filter(r => r.hechaPor === p).length;
  html += `<p style="color:var(--tinta-suave);font-size:.85rem;margin-top:18px">Se muestran los últimos ${S.registro.length} registros. Iván: ${cuenta('ivan')}, Jen: ${cuenta('jen')}.</p>`;
  return html;
}

/* ---------- Pintado general ---------- */
const PESTANAS = [
  ['hoy', 'Hoy', I.hoy], ['calendario', 'Calendario', I.cal], ['mias', 'Mis tareas', I.yo],
  ['tareas', 'Tareas', I.lista], ['historial', 'Historial', I.hist]
];
function pintar() {
  if (!S.usuario || !S.yo) return;
  const vistas = { hoy: vistaHoy, calendario: vistaCalendario, mias: vistaMias, tareas: vistaTareas, historial: vistaHistorial };
  const p = PERSONAS[S.yo];
  const scroll = window.scrollY;
  app.innerHTML = `<header class="top"><div class="marca">${I.tejado}HomePlan<span class="ver">v${VERSION_APP}</span></div>
      <button class="yo" data-cuenta style="color:${p.color}">${p.nombre}</button></header>
    <main>${vistas[S.vista]()}</main>
    <button class="fab" data-nueva aria-label="Nueva tarea">${I.mas}</button>
    <nav class="tabs"><div class="in">${PESTANAS.map(([k, n, ic]) =>
      `<button data-vista="${k}"${S.vista === k ? ' aria-current="page"' : ''}>${ic}<span>${n}</span></button>`).join('')}</div></nav>`;
  window.scrollTo(0, scroll);
}

/* ---------- Eventos ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('button, [data-editar]');
  if (!el) return;
  const d = el.dataset;
  if (d.completar) return completar(d.completar, el);
  if (d.editar) return formularioTarea(S.tareas.find(t => t.id === d.editar));
  if (d.vista) { S.vista = d.vista; window.scrollTo(0, 0); return pintar(); }
  if (d.hoy) { S.hoySolo = d.hoy; return pintar(); }
  if ('nueva' in d) return formularioTarea(null);
  if ('categorias' in d) return formularioCategorias();
  if ('cuenta' in d) return menuCuenta();
  if (d.modo) { S.cal.modo = d.modo; return pintar(); }
  if ('irhoy' in d) { S.cal.fecha = hoy(); return pintar(); }
  if (d.dia) { S.cal.fecha = d.dia; S.cal.modo = 'dia'; return pintar(); }
  if (d.mover) {
    const n = parseInt(d.mover, 10), c = S.cal;
    c.fecha = c.modo === 'dia' ? sumarDias(c.fecha, n) : c.modo === 'semana' ? sumarDias(c.fecha, 7 * n) : sumarMeses(c.fecha, n);
    return pintar();
  }
});
app.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.calfiltro) S.cal[d.calfiltro] = e.target.value;
  else if (d.listafiltro) S.lista[d.listafiltro] = e.target.value;
  else if (d.histfiltro) S.hist[d.histfiltro] = e.target.value;
  else return;
  pintar();
});

/* ---------- Hojas inferiores ---------- */
function abrirHoja(html) {
  sheet.innerHTML = `<div class="panel">${html}</div>`;
  sheet.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function cerrarHoja() { sheet.classList.add('hidden'); sheet.innerHTML = ''; document.body.style.overflow = ''; }
sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('[data-cerrar]')) cerrarHoja(); });

function formularioTarea(t) {
  const nueva = !t;
  const v = t || { nombre: '', categoriaId: S.categorias[0]?.id || '', responsable: S.yo, turno: S.yo,
    frecuencia: { tipo: 'semanas', cada: 1 }, proxima: hoy(), notas: '', activa: true };
  const fr = v.frecuencia || { tipo: 'una', cada: 1 };
  const resp = [['ivan', 'Iván'], ['jen', 'Jen'], ['ambos', 'Ambos'], ['alternar', 'Alternar']];
  abrirHoja(`<h3>${nueva ? 'Nueva tarea' : 'Editar tarea'}</h3>
    <div class="campo"><label for="f-nombre">Nombre</label><input type="text" id="f-nombre" value="${esc(v.nombre)}" placeholder="Limpiar ventanas" maxlength="80"></div>
    <div class="campo"><label for="f-cat">Categoría</label><select id="f-cat">${S.categorias.map(c => `<option value="${c.id}"${v.categoriaId === c.id ? ' selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <div class="campo"><span class="lbl">Quién la hace</span>
      <div class="seg" id="f-resp">${resp.map(([k, n]) => `<button type="button" data-r="${k}" aria-pressed="${v.responsable === k}">${n}</button>`).join('')}</div></div>
    <div class="campo${v.responsable === 'alternar' ? '' : ' hidden'}" id="f-turno-c"><label for="f-turno">Le toca ahora a</label>
      <select id="f-turno"><option value="ivan"${(v.turno || 'ivan') === 'ivan' ? ' selected' : ''}>Iván</option><option value="jen"${v.turno === 'jen' ? ' selected' : ''}>Jen</option></select></div>
    <div class="campo"><span class="lbl">Frecuencia</span>
      <div class="fila2"><select id="f-tipo" aria-label="Tipo de frecuencia">
        ${[['una', 'Una vez'], ['dias', 'Días'], ['semanas', 'Semanas'], ['meses', 'Meses'], ['anios', 'Años']].map(([k, n]) => `<option value="${k}"${fr.tipo === k ? ' selected' : ''}>${n}</option>`).join('')}
      </select><input type="number" id="f-cada" min="1" max="365" value="${esc(fr.cada || 1)}" aria-label="Cada cuántos"${fr.tipo === 'una' ? ' disabled' : ''}></div>
      <p id="f-freq-txt" style="margin:6px 0 0;color:var(--tinta-suave);font-size:.88rem">${textoFrecuencia(fr)}</p></div>
    <div class="campo"><label for="f-fecha">${nueva ? 'Primera vez' : 'Próxima vez'}</label><input type="date" id="f-fecha" value="${esc(v.proxima || hoy())}"></div>
    <div class="campo"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Opcional">${esc(v.notas || '')}</textarea></div>
    ${!nueva && v.activa !== false ? `<div class="campo" style="background:var(--menta-suave);border-radius:var(--radio);padding:12px">
      <span class="lbl">¿Ya está hecha y se olvidó marcar?</span>
      <div class="fila2"><input type="date" id="h-fecha" value="${hoy()}" max="${hoy()}" aria-label="Día en que se hizo">
        <select id="h-quien" aria-label="Quién la hizo">${Object.entries(PERSONAS).map(([k, p]) => `<option value="${k}"${k === S.yo ? ' selected' : ''}>${p.nombre}</option>`).join('')}</select></div>
      <button class="btn ancho" id="h-marcar" style="margin-top:8px;background:var(--menta);color:#fff">Marcar como hecha ese día</button>
      <p style="margin:6px 0 0;color:var(--tinta-suave);font-size:.85rem">La siguiente vez se calcula desde el día que elijas.</p></div>` : ''}
    ${!nueva && v.activa === false ? `<p style="color:var(--tinta-suave)">Esta tarea de una sola vez ya está hecha. Al guardar vuelve a quedar pendiente.</p>` : ''}
    <div class="acciones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="f-guardar">Guardar</button></div>
    ${nueva ? '' : `<button class="btn peligro ancho" id="f-borrar" style="margin-top:10px">Borrar tarea</button>`}`);

  let responsable = v.responsable;
  const $ = s => sheet.querySelector(s);
  $('#f-resp').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    responsable = b.dataset.r;
    sheet.querySelectorAll('#f-resp button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#f-turno-c').classList.toggle('hidden', responsable !== 'alternar');
  };
  const refrescarFreq = () => {
    const tipo = $('#f-tipo').value;
    $('#f-cada').disabled = tipo === 'una';
    $('#f-freq-txt').textContent = textoFrecuencia({ tipo, cada: $('#f-cada').value });
  };
  $('#f-tipo').onchange = refrescarFreq; $('#f-cada').oninput = refrescarFreq;

  $('#f-guardar').onclick = () => {
    const nombre = $('#f-nombre').value.trim();
    if (!nombre) { $('#f-nombre').focus(); return avisar('Escribe un nombre para la tarea'); }
    const fecha = $('#f-fecha').value || hoy();
    const datos = {
      nombre, categoriaId: $('#f-cat').value || null,
      responsable, turno: responsable === 'alternar' ? $('#f-turno').value : null,
      frecuencia: { tipo: $('#f-tipo').value, cada: Math.max(1, parseInt($('#f-cada').value, 10) || 1) },
      proxima: fecha, notas: $('#f-notas').value.trim(), activa: true
    };
    const op = nueva
      ? FB.addDoc(FB.collection(db, 'tareas'), { ...datos, creadaPor: S.yo, creada: FB.serverTimestamp() })
      : FB.updateDoc(FB.doc(db, 'tareas', t.id), datos);
    op.catch(alError);
    cerrarHoja();
    avisar(nueva ? 'Tarea creada' : 'Cambios guardados');
  };
  if (!nueva && v.activa !== false) $('#h-marcar').onclick = () => {
    const fecha = $('#h-fecha').value;
    if (!fecha || fecha > hoy()) { $('#h-fecha').focus(); return avisar('Elige hoy o un día anterior'); }
    cerrarHoja();
    completar(t.id, null, fecha, $('#h-quien').value);
  };
  if (!nueva) $('#f-borrar').onclick = () => {
    if (!confirm(`¿Borrar "${t.nombre}"? El historial de veces que se hizo se conserva.`)) return;
    FB.deleteDoc(FB.doc(db, 'tareas', t.id)).catch(alError);
    cerrarHoja();
    avisar('Tarea borrada');
  };
  if (nueva) setTimeout(() => $('#f-nombre').focus(), 50);
}

function formularioCategorias() {
  const usadas = new Set(S.tareas.map(t => t.categoriaId));
  abrirHoja(`<h3>Categorías</h3>
    <div id="cats">${S.categorias.map(c => `<div class="cat-edit" data-id="${c.id}">
      <input type="color" value="${esc(c.color)}" aria-label="Color de ${esc(c.nombre)}">
      <input type="text" value="${esc(c.nombre)}" aria-label="Nombre de la categoría" maxlength="30">
      <button class="icono" data-borrarcat="${c.id}" aria-label="Borrar ${esc(c.nombre)}"${usadas.has(c.id) ? ' disabled title="Tiene tareas asignadas"' : ''}>✕</button></div>`).join('')}</div>
    <div class="cat-edit"><input type="color" id="nc-color" value="#2FA3C4" aria-label="Color de la nueva categoría">
      <input type="text" id="nc-nombre" placeholder="Nueva categoría" maxlength="30"></div>
    <p style="color:var(--tinta-suave);font-size:.85rem">Solo se pueden borrar las categorías sin tareas.</p>
    <div class="acciones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="c-guardar">Guardar</button></div>`);
  sheet.querySelectorAll('[data-borrarcat]').forEach(b => b.onclick = () => {
    if (!confirm('¿Borrar esta categoría?')) return;
    FB.deleteDoc(FB.doc(db, 'categorias', b.dataset.borrarcat)).catch(alError);
    b.closest('.cat-edit').remove();
  });
  sheet.querySelector('#c-guardar').onclick = () => {
    sheet.querySelectorAll('#cats .cat-edit').forEach(fila => {
      const id = fila.dataset.id, [color, nombre] = fila.querySelectorAll('input');
      const orig = S.categorias.find(c => c.id === id);
      const n = nombre.value.trim();
      if (orig && n && (n !== orig.nombre || color.value !== orig.color))
        FB.updateDoc(FB.doc(db, 'categorias', id), { nombre: n, color: color.value }).catch(alError);
    });
    const nn = sheet.querySelector('#nc-nombre').value.trim();
    if (nn) FB.addDoc(FB.collection(db, 'categorias'), { nombre: nn, color: sheet.querySelector('#nc-color').value }).catch(alError);
    cerrarHoja();
    avisar('Categorías guardadas');
  };
}

function menuCuenta() {
  abrirHoja(`<h3>Cuenta</h3>
    <p>Has entrado como <strong>${esc(S.usuario.email)}</strong> (${PERSONAS[S.yo].nombre}).</p>
    <p style="color:var(--tinta-suave);font-size:.85rem">HomePlan v${VERSION_APP}</p>
    <div class="acciones"><button class="btn sec" data-cerrar>Cerrar</button><button class="btn peligro" id="salir">Cerrar sesión</button></div>`);
  sheet.querySelector('#salir').onclick = () => { cerrarHoja(); FB.signOut(auth); };
}

/* Si la app queda abierta al cambiar de día, repintar */
let ultimoDia = hoy();
setInterval(() => { if (hoy() !== ultimoDia) { ultimoDia = hoy(); pintar(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && hoy() !== ultimoDia) { ultimoDia = hoy(); pintar(); } });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker no registrado', e)));
}

iniciar();
</script>
</body>
</html>
