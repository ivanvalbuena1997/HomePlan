<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17303A">
<title>HomePlan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HomePlan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F3F7F6; --superficie:#FFFFFF; --tinta:#17303A; --tinta-suave:#5B7079;
  --azulejo:#D7ECEF; --linea:#DDE6E6; --menta:#2E9E6B; --menta-suave:#DDF2E6;
  --sol:#FFC93C; --alerta:#D9483B; --alerta-suave:#FBE3E0;
  /* Colores de persona: azul Iván, lila Jen, amarillo los dos */
  --ivan:#2F74D9; --ivan-suave:#E2EDFC;
  --jen:#8B5CD6;  --jen-suave:#EEE6FB;
  --ambos:#E3A400; --ambos-suave:#FFF3CC; --ambos-texto:#3A2C00;
  --radio:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#0E1C21; --superficie:#16272D; --tinta:#E6F0F1; --tinta-suave:#9AB0B6;
    --azulejo:#1D3A41; --linea:#24393F; --menta:#3DBB82; --menta-suave:#173A2B;
    --sol:#FFD25C; --alerta:#F06A5C; --alerta-suave:#3A1F1C;
    --ivan:#6FA2F2; --ivan-suave:#1B2D47;
    --jen:#B597F2;  --jen-suave:#2C2245;
    --ambos:#F2C43D; --ambos-suave:#3A3115; --ambos-texto:#2A1F00;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
.hidden{display:none!important}

/* Estructura */
#app{max-width:640px;margin:0 auto;min-height:100%;padding:0 16px 100px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;gap:10px}
.marca{font-weight:900;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.marca .tejado{width:26px;height:26px}
.ver{font-size:.75rem;font-weight:800;color:var(--tinta-suave);background:var(--azulejo);border-radius:999px;padding:2px 8px;margin-left:2px}
.yo{border:0;background:var(--azulejo);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--superficie);border-top:1px solid var(--linea);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:.8rem;font-weight:700;color:var(--tinta-suave);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--tinta)}
nav.tabs button[aria-current="page"] svg{color:var(--menta)}

/* Cabecera del tablón */
.tablon-cab{margin:8px 0 12px;padding:16px 18px;background:var(--azulejo);border-radius:22px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 18px}
.tablon-cab .dia{font-weight:900;font-size:1.9rem;line-height:1.05;letter-spacing:-.03em;margin:0}
.tablon-cab .reloj{font-weight:900;color:var(--tinta-suave)}
.tablon-cab .resumen{font-weight:800;font-size:.95rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.controles{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.controles .seg{flex:1;min-width:160px}
.nav-fecha{display:flex;align-items:center;gap:6px;flex:2;min-width:250px}
.nav-fecha .tit{flex:1;text-align:center;font-weight:900;font-size:1.05rem}

h2{font-size:1.05rem;font-weight:800;margin:22px 0 8px}
h2 .n{color:var(--tinta-suave);font-weight:700}
.vacio{color:var(--tinta-suave);background:var(--superficie);border:1px dashed var(--linea);border-radius:var(--radio);padding:16px;text-align:center}
.vacio.grande{margin-top:40px;padding:40px 20px;font-weight:700}
.sub{margin:0 0 14px;color:var(--tinta-suave)}
.nota{color:var(--tinta-suave);font-size:.85rem}

/* Colores por persona */
.p-ivan{--pc:var(--ivan);--pc-suave:var(--ivan-suave)}
.p-jen{--pc:var(--jen);--pc-suave:var(--jen-suave)}
.p-ambos{--pc:var(--ambos);--pc-suave:var(--ambos-suave)}

/* Semana */
.semana{display:flex;flex-direction:column;gap:6px}
.dia-col{scroll-margin-top:8px}
.dia-col h3{display:flex;align-items:center;justify-content:space-between;font-size:.98rem;margin:14px 0 6px;font-weight:800}
.dia-col.es-hoy h3{color:var(--menta)}
.dia-col h3 .corto{display:none}
.mas-dia{border:1px solid var(--linea);background:var(--superficie);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;padding:0;color:var(--tinta-suave)}
.mas-dia svg{width:18px;height:18px}
.libre{color:var(--tinta-suave);font-size:.9rem;margin:2px 0 4px;padding:8px 12px;border:1px dashed var(--linea);border-radius:12px}

/* Tarjetas */
.lista{display:flex;flex-direction:column;gap:6px}
.tarjeta{display:flex;gap:10px;align-items:flex-start;background:var(--pc-suave,var(--superficie));border-left:5px solid var(--pc,var(--linea));border-radius:12px;padding:10px}
.tarjeta.atrasada{box-shadow:0 0 0 2px var(--alerta)}
.tarjeta.hecha{opacity:.62}
.tarjeta.hecha .nombre{text-decoration:line-through}
.tarjeta.pasado{opacity:.55}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:3px solid var(--menta);background:var(--superficie);display:grid;place-items:center;padding:0}
.check svg{width:17px;height:17px;opacity:0;color:#fff}
.check.lleno{background:var(--menta)}
.check.lleno svg{opacity:1}
.check.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.check.futuro{border-style:dashed;border-color:var(--pc,var(--linea));background:transparent;opacity:.6}
.ev-ico{flex:none;width:32px;height:32px;display:grid;place-items:center;color:var(--pc)}
.ev-ico svg{width:22px;height:22px}
.info{flex:1;min-width:0;cursor:pointer}
.nombre{font-weight:800;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.84rem;color:var(--tinta-suave);margin-top:2px;align-items:center}
.meta .quien{font-weight:800;color:var(--tinta)}
.meta .hora{font-weight:800;color:var(--tinta)}
.rojo{color:var(--alerta);font-weight:800}

/* Mes */
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mes .dsem{text-align:center;font-size:.75rem;font-weight:800;color:var(--tinta-suave);padding:4px 0}
.celda{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;min-height:64px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.celda.fuera{opacity:.45}
.celda.es-hoy{border:2px solid var(--sol)}
.celda .num{font-weight:800;font-size:.85rem}
.celda .marcas{display:flex;flex-wrap:wrap;gap:3px}
.mini{width:8px;height:8px;border-radius:50%;background:var(--pc);font-size:0;overflow:hidden}
.mini.ok{outline:2px solid var(--menta);outline-offset:1px}
.celda .mas{font-size:.7rem;font-weight:800;color:var(--tinta-suave)}

/* Controles */
.seg{display:flex;background:var(--superficie);border:1px solid var(--linea);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-weight:700;font-size:.92rem;color:var(--tinta-suave);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;background:var(--superficie);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--tinta);color:var(--papel)}
.btn.sec{background:var(--azulejo);color:var(--tinta)}
.btn.peligro{background:var(--alerta-suave);color:var(--alerta)}
.btn.ok{background:var(--menta);color:#fff}
.btn.ancho{width:100%}
.btn.peq{padding:8px 12px}
.icono{border:1px solid var(--linea);background:var(--superficie);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;padding:0;flex:none}
.icono svg{width:20px;height:20px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--sol);color:#17303A;box-shadow:0 6px 18px rgba(23,48,58,.25);display:grid;place-items:center;z-index:11}
.fab svg{width:28px;height:28px}

/* Hoja inferior (formularios) */
.sheet{position:fixed;inset:0;background:rgba(10,25,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--papel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 6px;font-size:1.25rem;font-weight:900;overflow-wrap:anywhere}
.campo{margin-bottom:14px}
.campo label,.campo .lbl,.lbl{display:block;font-weight:800;font-size:.9rem;margin-bottom:6px}
.fila2{display:flex;gap:8px;align-items:center}
.fila2>*{flex:1}
.acciones{display:flex;gap:8px;margin-top:18px}
.acciones .btn{flex:1}
.pila{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chips{display:flex;gap:5px}
.chip{flex:1;border:1px solid var(--linea);background:var(--superficie);border-radius:10px;padding:9px 0;font-weight:800}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.opciones{display:flex;flex-direction:column;gap:8px}
.opcion{text-align:left;border:2px solid var(--linea);background:var(--superficie);border-radius:14px;padding:10px 14px;font-weight:700}
.opcion b{display:block;font-weight:900}
.opcion[aria-pressed="true"]{border-color:var(--menta);background:var(--menta-suave)}
.quien-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.quien-btns .btn{padding:16px 8px;font-size:1.05rem}
.bq-ivan{background:var(--ivan)!important;color:#fff!important}
.bq-jen{background:var(--jen)!important;color:#fff!important}
.bq-ambos{background:var(--ambos)!important;color:var(--ambos-texto)!important}
.ficha-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--tinta-suave);font-weight:700;margin-bottom:6px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;margin:12px 0}
.interruptor b{display:block}
.interruptor span{color:var(--tinta-suave);font-size:.85rem}

/* Aviso (arriba, para no tapar las hojas inferiores) */
.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;top:calc(12px + env(safe-area-inset-top,0px));box-shadow:0 6px 18px rgba(10,25,30,.3);background:var(--tinta);color:var(--papel);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px);font-weight:700}
.toast button{border:0;background:var(--sol);color:#17303A;border-radius:10px;padding:6px 10px;font-weight:800}

/* Pantallas de acceso */
.acceso{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:24px}
.acceso .tejado{width:84px;height:84px}
.acceso h1{font-size:2.4rem;font-weight:900;letter-spacing:-.03em;margin:0}
.acceso p{color:var(--tinta-suave);max-width:34ch;margin:0}
.eleccion{display:flex;gap:12px;margin-top:6px}
.eleccion button{border:0;border-radius:18px;padding:18px 26px;font-weight:900;font-size:1.2rem;color:#fff}

/* Títulos de pestaña */
.titulo-vista{font-weight:900;font-size:1.7rem;letter-spacing:-.03em;margin:8px 0 12px}

/* Lista de la compra */
.anadir{background:var(--azulejo);border-radius:20px;padding:12px;margin-bottom:12px}
.fila-anadir{display:grid;grid-template-columns:90px 1fr auto;gap:8px}
.fila-anadir #c-nombre{grid-column:1 / -1}
.cab-vista{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cab-vista .botones{display:flex;gap:8px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sugs .lbl{margin:0 4px 0 0;font-size:.82rem;color:var(--tinta-suave)}
.sug{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem}
.sug small{font-weight:600;color:var(--tinta-suave);margin-left:4px}
.enlace{border:0;background:none;color:var(--tinta-suave);font-weight:700;text-decoration:underline;padding:6px;font-size:.85rem}
.tiendas-f{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1 1 100%;min-width:0;scrollbar-width:none}
.tiendas-f button{flex:none;border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem;color:var(--tinta-suave)}
.tiendas-f button[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.compra-grupos{display:flex;flex-direction:column}
.tienda-grupo h2{margin-top:16px}
.item{display:flex;gap:12px;align-items:center;background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:10px 12px}
.item .check{width:34px;height:34px}
.item.comprado{opacity:.55}
.item.comprado .nombre{text-decoration:line-through}
.fila-edit{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.fila-edit input,.fila-edit select{flex:1;min-width:0}

/* Películas y series */
.filtros-pelis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filtros-pelis .seg,.filtros-pelis #p-buscar{grid-column:1 / -1}
.pelis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.peli{background:var(--superficie);border:1px solid var(--linea);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.peli.vista{opacity:.7}
.peli-tit{font-weight:900;font-size:1.08rem;line-height:1.2;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--azulejo);color:var(--tinta)}
.pill.plat{background:var(--tinta);color:var(--papel)}
.pill.viendo{background:var(--sol);color:#17303A}
.pill.vista{background:var(--menta);color:#fff}
.pill.cat{background:transparent;border:1px solid var(--linea);color:var(--tinta-suave)}
.estrellas{color:var(--sol);letter-spacing:1px;font-size:1rem;line-height:1}
.estrellas .apagada{color:var(--linea)}
.progreso{font-size:.88rem;font-weight:800;color:var(--menta)}
.desc{font-size:.88rem;color:var(--tinta-suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.estrellas-btn{display:flex;gap:4px}
.estrellas-btn button{border:0;background:none;font-size:2rem;line-height:1;padding:2px;color:var(--linea)}
.estrellas-btn button.on{color:var(--sol)}
.contador{display:flex;align-items:center;gap:10px}
.contador .num{font-weight:900;font-size:1.4rem;min-width:3ch;text-align:center}
.rueda{position:relative;width:min(320px,86vw);margin:6px auto 12px}
.rueda-svg{width:100%;height:auto;display:block}
.rueda-svg g{transition:none}
.puntero{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--alerta);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.resultado{text-align:center;font-weight:900;font-size:1.3rem;min-height:1.6em;margin:0 0 10px}

/* Pantalla ancha (tablet en horizontal): la semana entera en 7 columnas */
@media (min-width: 900px){
  #app{max-width:none;padding:0 18px 96px}
  nav.tabs .in{max-width:900px}
  .fab{right:24px}
  .tablon-cab{padding:12px 18px;align-items:center}
  .tablon-cab .dia{font-size:1.7rem}
  .semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:stretch}
  .dia-col{background:var(--superficie);border:1px solid var(--linea);border-radius:16px;padding:8px;min-height:62vh}
  .dia-col.es-hoy{border:2px solid var(--sol)}
  .dia-col h3{margin:0 0 8px;font-size:1rem}
  .dia-col h3 .corto{display:inline}
  .dia-col h3 .largo{display:none}
  .libre{border:0;padding:4px 2px;font-size:.85rem}
  .tarjeta{padding:7px 7px 7px 6px;gap:7px;border-left-width:4px}
  .tarjeta .nombre{font-size:.92rem;line-height:1.2}
  .meta{font-size:.76rem;gap:0 8px}
  .check,.ev-ico{width:28px;height:28px}
  .check svg{width:15px;height:15px}
  .ev-ico svg{width:19px;height:19px}
  .celda{min-height:112px;padding:6px}
  .celda .marcas{flex-direction:column;flex-wrap:nowrap;gap:2px}
  .mini{width:auto;height:auto;border-radius:5px;background:var(--pc-suave);border-left:3px solid var(--pc);font-size:.72rem;font-weight:700;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinta)}
  .mini.ok{outline:0;text-decoration:line-through;opacity:.65}
  .compra-grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 14px;align-items:start}
  .fila-anadir{grid-template-columns:2fr 1fr 1fr auto}
  .fila-anadir #c-nombre{grid-column:auto}
  .filtros-pelis{grid-template-columns:2fr repeat(5,1fr)}
  .filtros-pelis #p-buscar{grid-column:auto}
  .tiendas-f{flex:1 1 0}
}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
/* =====================================================================
   HomePlan v1.7 — Tablón, Películas y series, Lista de la compra
   ===================================================================== */
const FIREBASE_VERSION = '12.19.0';
const firebaseConfig = {
  apiKey: "AIzaSyArov2KoFakhjdynfteXKfvGChU1nD40fs",
  authDomain: "homeplan-496cf.firebaseapp.com",
  projectId: "homeplan-496cf",
  storageBucket: "homeplan-496cf.firebasestorage.app",
  messagingSenderId: "818389477523",
  appId: "1:818389477523:web:5352b908d26c50d72a4566",
  measurementId: "G-G3KRG9DN75"
};

const VERSION_APP = '1.7';
const PERSONAS = { ivan: { nombre: 'Iván' }, jen: { nombre: 'Jen' } };
const CLAVE_TABLET = 'homeplan-tablet';
const MINUTOS_VOLVER_A_HOY = 5;

/* ---------- Utilidades de fecha (fechas locales como 'AAAA-MM-DD') ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const aFecha = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoy = () => ymd(new Date());
function sumarDias(s, n) { const d = aFecha(s); d.setDate(d.getDate() + n); return ymd(d); }
function sumarMeses(s, n) {
  const d = aFecha(s), dia = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const ultimo = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(dia, ultimo));
  return ymd(t);
}
const diasEntre = (a, b) => Math.round((aFecha(b) - aFecha(a)) / 864e5);
const mesesEntre = (a, b) => { const x = aFecha(a), y = aFecha(b); return (y.getFullYear() - x.getFullYear()) * 12 + y.getMonth() - x.getMonth(); };
const diaSemana = s => (aFecha(s).getDay() + 6) % 7; // lunes = 0
const lunesDe = s => sumarDias(s, -diaSemana(s));
const mayor = (a, b) => (a > b ? a : b);
const DIAS_CORTOS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = (s, o) => cap(new Intl.DateTimeFormat('es-ES', o).format(aFecha(s)));
const fechaLarga = s => fmt(s, { weekday: 'long', day: 'numeric', month: 'long' });
const fechaCorta = s => fmt(s, { day: 'numeric', month: 'short' });
const fechaConDia = s => fmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
function fechaRelativa(s) {
  const h = hoy();
  if (s === h) return 'hoy';
  if (s === sumarDias(h, 1)) return 'mañana';
  if (s === sumarDias(h, -1)) return 'ayer';
  return fechaConDia(s);
}
const cadaDe = f => Math.max(1, parseInt(f && f.cada, 10) || 1);
const repite = t => !!(t.frecuencia && t.frecuencia.tipo && t.frecuencia.tipo !== 'una');
const esMultidia = f => !!(f && f.tipo === 'semanas' && Array.isArray(f.dias) && f.dias.length > 1);

/* Fecha de la repetición número i contando desde s (i=0 es s) */
function paso(s, f, i) {
  const n = cadaDe(f) * i;
  switch (f.tipo) {
    case 'dias': return sumarDias(s, n);
    case 'semanas': return sumarDias(s, 7 * n);
    case 'meses': return sumarMeses(s, n);
    case 'anios': return sumarMeses(s, 12 * n);
    default: return i === 0 ? s : null;
  }
}
function textoFrecuencia(f, hasta) {
  if (!f || !f.tipo || f.tipo === 'una') return 'No se repite';
  const n = cadaDe(f);
  let txt;
  if (esMultidia(f)) {
    const dias = [...f.dias].sort((a, b) => a - b).map(d => DIAS_CORTOS[d]).join(', ');
    txt = (n === 1 ? 'Cada semana: ' : `Cada ${n} semanas: `) + dias;
  } else {
    const uno = { dias: 'Cada día', semanas: 'Cada semana', meses: 'Cada mes', anios: 'Cada año' };
    const varios = { dias: 'días', semanas: 'semanas', meses: 'meses', anios: 'años' };
    txt = n === 1 ? uno[f.tipo] : `Cada ${n} ${varios[f.tipo]}`;
  }
  return hasta ? `${txt}, hasta el ${fechaCorta(hasta)}` : txt;
}
const horaTexto = x => x.horaInicio ? (x.horaFin ? `${x.horaInicio}–${x.horaFin}` : x.horaInicio) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Arranque de Firebase ---------- */
async function iniciar() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  try {
    const [a, au, fs] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`)
    ]);
    FB = { ...a, ...au, ...fs };
  } catch (e) {
    app.innerHTML = `<div class="acceso">${I.tejado}<h1>HomePlan</h1><p>No se pudo cargar Firebase. Comprueba la conexión.</p></div>`;
    console.error(e);
    return;
  }
  const fbApp = FB.initializeApp(firebaseConfig);
  auth = FB.getAuth(fbApp);
  try {
    db = FB.initializeFirestore(fbApp, {
      localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() })
    });
  } catch (e) {
    console.warn('Caché sin conexión no disponible, sigo sin ella', e);
    db = FB.getFirestore(fbApp);
  }
  FB.onAuthStateChanged(auth, usuario => {
    desuscribir.forEach(f => f()); desuscribir = [];
    S.usuario = usuario; S.yo = null;
    if (!usuario) return pintarLogin();
    escucharPerfil();
  });
}

/* ---------- Modelo: tareas y eventos ----------
   Un elemento del tablón (colección "tareas") puede ser:
   - tipo 'tarea': tiene check; "proxima" es la fecha de la vez pendiente.
   - tipo 'evento': no tiene check; "proxima" es el día en que empieza.
   frecuencia: { tipo: una|dias|semanas|meses|anios, cada, dias?: [0..6] (lunes=0, solo con 2 o más días) }
   hasta: último día de la repetición (opcional)
   excepciones: { 'AAAA-MM-DD' (fecha original): { borrada } | { fecha, nombre, horaInicio, horaFin, responsable, notas } } */
const tipoDe = t => t.tipo === 'evento' ? 'evento' : 'tarea';
const otro = p => p === 'ivan' ? 'jen' : 'ivan';
const nombreQuien = k => k === 'ambos' ? 'Los dos' : (PERSONAS[k]?.nombre || '?');
const siguienteTurno = (actual, quien) => quien === 'ambos' ? (actual || 'ivan') : otro(quien);
const hizo = (r, p) => r.hechaPor === p || r.hechaPor === 'ambos';

/* Fechas de la serie (sin excepciones) entre desde y hasta, ambas incluidas */
function fechasSerie(t, desde, hasta) {
  const f = t.frecuencia, inicio = t.proxima, out = [];
  if (!inicio) return out;
  const lim = t.hasta && t.hasta < hasta ? t.hasta : hasta;
  const ini = mayor(desde, inicio);
  if (ini > lim) return out;
  if (!repite(t)) { if (inicio >= desde && inicio <= lim) out.push(inicio); return out; }
  const cada = cadaDe(f);
  if (esMultidia(f)) {
    const lun0 = lunesDe(inicio);
    const dias = [...f.dias].map(Number).sort((a, b) => a - b);
    let w = Math.floor(diasEntre(lun0, lunesDe(ini)) / 7);
    w -= w % cada;
    for (; ; w += cada) {
      const lun = sumarDias(lun0, 7 * w);
      if (lun > lim) break;
      for (const di of dias) { const d = sumarDias(lun, di); if (d >= ini && d <= lim) out.push(d); }
    }
    return out;
  }
  let i0;
  if (f.tipo === 'dias' || f.tipo === 'semanas') i0 = Math.floor(diasEntre(inicio, ini) / (cada * (f.tipo === 'semanas' ? 7 : 1)));
  else i0 = Math.floor(mesesEntre(inicio, ini) / (cada * (f.tipo === 'anios' ? 12 : 1)));
  i0 = Math.max(0, i0 - 1);
  for (let i = i0; i < i0 + 5000; i++) {
    const d = paso(inicio, f, i);
    if (!d || d > lim) break;
    if (d >= ini) out.push(d);
  }
  return out;
}
const esFechaDeSerie = (t, d) => fechasSerie(t, d, d).includes(d);

/* Veces del elemento que caen entre desde y hasta (con excepciones aplicadas) */
function ocurrenciasDe(t, desde, hasta) {
  const exc = t.excepciones || {};
  const esTarea = tipoDe(t) === 'tarea';
  const res = [];
  const poner = orig => {
    const x = exc[orig] || null;
    if (x && x.borrada) return;
    const fecha = (x && x.fecha) || orig;
    if (fecha < desde || fecha > hasta) return;
    res.push({ t, orig, fecha, x, actual: esTarea && orig === t.proxima });
  };
  for (const d of fechasSerie(t, desde, hasta)) if (!(exc[d] && exc[d].fecha)) poner(d);
  for (const [orig, x] of Object.entries(exc)) {
    if (!x || !x.fecha || x.borrada || x.fecha < desde || x.fecha > hasta) continue;
    if (esFechaDeSerie(t, orig)) poner(orig);
  }
  return res;
}

/* La vez pendiente de una tarea */
function ocurrenciaActual(t) {
  if (!t || tipoDe(t) !== 'tarea' || t.activa === false || !t.proxima) return null;
  const x = (t.excepciones || {})[t.proxima] || null;
  const usable = x && !x.borrada ? x : null;
  return { t, orig: t.proxima, fecha: (usable && usable.fecha) || t.proxima, x: usable, actual: true };
}

/* Datos efectivos de una vez concreta: la serie con los cambios de ese día */
function datosOcc(o) {
  const t = o.t, x = o.x || {};
  const d = {
    nombre: x.nombre ?? t.nombre,
    horaInicio: x.horaInicio ?? (t.horaInicio || ''),
    horaFin: x.horaFin ?? (t.horaFin || ''),
    notas: x.notas ?? (t.notas || ''),
    responsable: x.responsable || t.responsable || 'ambos',
    turno: t.turno || 'ivan',
    alternado: false
  };
  if (!x.responsable && t.responsable === 'alternar') {
    // Previsión del turno: va cambiando en cada repetición desde la vez actual (o desde el inicio en eventos)
    const idx = o.actual ? 0 : Math.max(0, fechasSerie(t, t.proxima, o.orig).length - 1);
    d.responsable = idx % 2 === 0 ? (t.turno || 'ivan') : otro(t.turno || 'ivan');
    d.alternado = true;
  }
  return d;
}
const quienDe = d => d.responsable === 'alternar' ? 'ivan' : d.responsable;

/* Próxima fecha de una tarea al completarla el día "hecha".
   modo 'hoy': la siguiente cuenta desde el día en que se hizo.
   modo 'calendario': se mantiene el calendario original, saltando las fechas ya pasadas. */
function siguienteFecha(t, hecha, modo) {
  if (!repite(t)) return null;
  let r;
  if (modo === 'hoy' && !esMultidia(t.frecuencia)) r = paso(hecha, t.frecuencia, 1);
  else r = primeraLibre(t, sumarDias(mayor(hecha, t.proxima), 1));
  if (r && t.hasta && r > t.hasta) return null;
  return r;
}
function primeraLibre(t, desde) {
  const exc = t.excepciones || {};
  let a = desde;
  for (let k = 0; k < 12; k++) {
    const b = sumarDias(a, 400);
    for (const d of fechasSerie(t, a, b)) if (!(exc[d] && exc[d].borrada)) return d;
    if (t.hasta && b >= t.hasta) return null;
    a = sumarDias(b, 1);
  }
  return null;
}
/* Quita las excepciones que ya quedaron atrás */
function excepcionesDesde(exc, desde) {
  const r = {};
  for (const [k, v] of Object.entries(exc || {})) if (k >= desde) r[k] = v;
  return r;
}

/* ---------- Filtro por persona ---------- */
const pasaPersona = q => S.cal.persona === 'todos' || q === S.cal.persona || q === 'ambos';
const pasaRegistro = r => S.cal.persona === 'todos' || hizo(r, S.cal.persona);

/* Todo lo que hay que pintar entre dos fechas, agrupado por día */
function mapaTablon(desde, hasta) {
  const h = hoy(), mapa = {};
  const meter = (fecha, it) => (mapa[fecha] ||= []).push(it);
  for (const t of S.tareas) {
    if (tipoDe(t) === 'tarea' && t.activa === false) continue;
    for (const o of ocurrenciasDe(t, desde, hasta)) {
      if (o.actual && o.fecha < h) continue; // las atrasadas se muestran en el día de hoy
      const d = datosOcc(o);
      if (!pasaPersona(quienDe(d))) continue;
      meter(o.fecha, { tipo: 'occ', o, d, hora: d.horaInicio });
    }
  }
  if (h >= desde && h <= hasta) {
    for (const t of S.tareas) {
      const o = ocurrenciaActual(t);
      if (!o || o.fecha >= h) continue;
      const d = datosOcc(o);
      if (!pasaPersona(quienDe(d))) continue;
      meter(h, { tipo: 'occ', o, d, hora: '', atrasada: true });
    }
  }
  for (const r of S.registro) {
    if (r.fecha >= desde && r.fecha <= hasta && pasaRegistro(r)) meter(r.fecha, { tipo: 'reg', r, hora: r.horaInicio || '' });
  }
  for (const k in mapa) mapa[k].sort((a, b) =>
    (b.atrasada ? 1 : 0) - (a.atrasada ? 1 : 0) || (a.hora || '').localeCompare(b.hora || '') ||
    (a.tipo === 'reg' ? 1 : 0) - (b.tipo === 'reg' ? 1 : 0));
  return mapa;
}

/* ---------- Tarjetas ---------- */
function etiquetaQuien(d) {
  const q = quienDe(d);
  return `<span class="quien">${nombreQuien(q)}${d.alternado ? ' (turno)' : ''}</span>`;
}
function tarjetaOcc(it) {
  const { o, d } = it, t = o.t, q = quienDe(d), h = hoy();
  const esTarea = tipoDe(t) === 'tarea';
  let izq;
  if (esTarea && o.actual) izq = `<button class="check" data-completar="${t.id}" aria-label="Marcar ${esc(d.nombre)} como hecha">${I.ok}</button>`;
  else if (esTarea) izq = `<span class="check futuro" aria-hidden="true"></span>`;
  else izq = `<span class="ev-ico" aria-hidden="true">${I.cal}</span>`;
  const pasado = !esTarea && o.fecha < h;
  const hora = horaTexto(d);
  return `<div class="tarjeta p-${q}${it.atrasada ? ' atrasada' : ''}${pasado ? ' pasado' : ''}">${izq}
    <div class="info" data-occ="${t.id}" data-orig="${o.orig}">
      <div class="nombre">${esc(d.nombre)}</div>
      <div class="meta">${hora ? `<span class="hora">${hora}</span>` : ''}${etiquetaQuien(d)}${repite(t) ? '<span title="Se repite">↻</span>' : ''}${it.atrasada ? `<span class="rojo">Tocaba ${fechaRelativa(o.fecha)}</span>` : ''}</div>
    </div></div>`;
}
function tarjetaReg(r) {
  const hora = horaTexto(r);
  return `<div class="tarjeta hecha p-${r.hechaPor in PERSONAS || r.hechaPor === 'ambos' ? r.hechaPor : 'ambos'}">
    <span class="check lleno" aria-hidden="true">${I.ok}</span>
    <div class="info" data-registro="${r.id}"><div class="nombre">${esc(r.nombre)}</div>
    <div class="meta">${hora ? `<span class="hora">${hora}</span>` : ''}<span>Hecha por ${nombreQuien(r.hechaPor)}</span>${r.prevista && r.prevista < r.fecha ? `<span>tocaba ${fechaCorta(r.prevista)}</span>` : ''}</div></div></div>`;
}
const tarjeta = it => it.tipo === 'reg' ? tarjetaReg(it.r) : tarjetaOcc(it);

/* ---------- Pantalla: Tablón ---------- */
function resumenHoy() {
  const h = hoy();
  const pend = S.tareas.map(ocurrenciaActual).filter(o => o && o.fecha <= h && pasaPersona(quienDe(datosOcc(o))));
  const atrasadas = pend.filter(o => o.fecha < h).length;
  const hechas = S.registro.filter(r => r.fecha === h && pasaRegistro(r)).length;
  const total = pend.length + hechas;
  const partes = [total ? `Hoy: ${hechas} de ${total} tareas hechas` : 'Hoy no hay tareas pendientes'];
  if (atrasadas) partes.push(`<span class="rojo">${atrasadas} atrasada${atrasadas > 1 ? 's' : ''}</span>`);
  return partes.map(p => `<span>${p}</span>`).join('');
}

function vistaTablon() {
  const c = S.cal, h = hoy(), ahora = new Date();
  let titulo, cuerpo = '';
  if (c.modo === 'semana') {
    const ini = lunesDe(c.fecha), fin = sumarDias(ini, 6);
    titulo = `${fechaCorta(ini)} – ${fechaCorta(fin)}`;
    const mapa = mapaTablon(ini, fin);
    for (let i = 0; i < 7; i++) {
      const d = sumarDias(ini, i);
      const items = mapa[d] || [];
      cuerpo += `<section class="dia-col${d === h ? ' es-hoy' : ''}" id="d-${d}">
        <h3><span><span class="corto">${fmt(d, { weekday: 'short' }).replace('.', '')} ${aFecha(d).getDate()}</span><span class="largo">${fechaLarga(d)}</span>${d === h ? ' · Hoy' : ''}</span>
          <button class="mas-dia" data-nuevo-dia="${d}" aria-label="Añadir el ${fechaLarga(d)}">${I.mas}</button></h3>
        ${items.length ? `<div class="lista">${items.map(tarjeta).join('')}</div>` : '<p class="libre">Libre</p>'}</section>`;
    }
    cuerpo = `<div class="semana">${cuerpo}</div>`;
  } else {
    const f = aFecha(c.fecha);
    const primero = ymd(new Date(f.getFullYear(), f.getMonth(), 1));
    const ultimo = ymd(new Date(f.getFullYear(), f.getMonth() + 1, 0));
    titulo = cap(new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(f));
    const ini = lunesDe(primero), fin = sumarDias(lunesDe(ultimo), 6);
    const mapa = mapaTablon(ini, fin);
    let celdas = DIAS_CORTOS.map(x => `<div class="dsem">${x}</div>`).join('');
    for (let d = ini; d <= fin; d = sumarDias(d, 1)) {
      const items = mapa[d] || [];
      const marcas = items.map(it => it.tipo === 'reg'
        ? `<span class="mini ok p-${it.r.hechaPor}">${esc(it.r.nombre)}</span>`
        : `<span class="mini p-${quienDe(it.d)}">${it.d.horaInicio ? it.d.horaInicio + ' ' : ''}${esc(it.d.nombre)}</span>`);
      const max = anchoTablet.matches ? 4 : 6;
      const visibles = marcas.slice(0, max).join('') + (marcas.length > max ? `<span class="mas">+${marcas.length - max}</span>` : '');
      celdas += `<button class="celda${d < primero || d > ultimo ? ' fuera' : ''}${d === h ? ' es-hoy' : ''}" data-dia="${d}" aria-label="${fechaLarga(d)}, ${items.length} cosas">
        <span class="num">${aFecha(d).getDate()}</span><span class="marcas">${visibles}</span></button>`;
    }
    cuerpo = `<div class="mes">${celdas}</div><p class="nota">Toca un día para ver su semana.</p>`;
  }
  return `<section class="tablon-cab">
      <div><p class="dia">${cap(new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).format(ahora))}</p>
        <span class="reloj" id="reloj">${pad(ahora.getHours())}:${pad(ahora.getMinutes())}</span></div>
      <div class="resumen">${resumenHoy()}</div>
    </section>
    <div class="controles">
      <div class="seg" role="group" aria-label="Vista">
        <button data-modo="semana" aria-pressed="${c.modo === 'semana'}">Semana</button>
        <button data-modo="mes" aria-pressed="${c.modo === 'mes'}">Mes</button>
      </div>
      <div class="seg" role="group" aria-label="Persona">
        ${[['todos', 'Todos'], ['ivan', 'Iván'], ['jen', 'Jen']].map(([k, n]) => `<button data-persona="${k}" aria-pressed="${c.persona === k}">${n}</button>`).join('')}
      </div>
      <div class="nav-fecha">
        <button class="icono" data-mover="-1" aria-label="Anterior">${I.izq}</button>
        <div class="tit">${titulo}</div>
        <button class="icono" data-mover="1" aria-label="Siguiente">${I.der}</button>
        <button class="btn sec peq" data-irhoy>Hoy</button>
        <button class="icono" data-todo aria-label="Ver todas las tareas y eventos">${I.lista}</button>
      </div>
    </div>
    ${cuerpo}`;
}

/* =====================================================================
   Lista de la compra
   Colecciones: compra { nombre, cantidad, tiendaId, comprado, creado, creadoPor }
                tiendas { nombre, orden }
                productos/{nombre normalizado} { nombre, tiendaId, veces, ultimo }  (sugerencias)
   ===================================================================== */
const normal = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const idProducto = s => encodeURIComponent(normal(s)).slice(0, 400) || 'x';
const tiendaDe = i => (i.tiendaId && S.tiendas.some(t => t.id === i.tiendaId)) ? i.tiendaId : 'sin';
const nombreTienda = id => S.tiendas.find(t => t.id === id)?.nombre || 'Sin tienda';
const opcionesTienda = sel => `<option value=""${!sel ? ' selected' : ''}>Sin tienda</option>` +
  S.tiendas.map(t => `<option value="${t.id}"${sel === t.id ? ' selected' : ''}>${esc(t.nombre)}</option>`).join('');

function sugerenciasHTML(texto) {
  const enLista = new Set(S.compra.filter(i => !i.comprado).map(i => normal(i.nombre)));
  const q = normal(texto);
  let xs = S.productos.filter(p => p.nombre && !enLista.has(normal(p.nombre)));
  if (q) xs = xs.filter(p => normal(p.nombre).includes(q));
  xs.sort((a, b) => (q ? (normal(a.nombre).startsWith(q) ? 0 : 1) - (normal(b.nombre).startsWith(q) ? 0 : 1) : 0) ||
    (b.veces || 0) - (a.veces || 0) || a.nombre.localeCompare(b.nombre, 'es'));
  xs = xs.slice(0, q ? 8 : 16);
  if (!xs.length) return '';
  return `<span class="lbl">${q ? 'Sugerencias' : 'Habituales'}</span>` +
    xs.map(p => `<button class="sug" data-sug="${esc(p.id)}">+ ${esc(p.nombre)}${p.tiendaId && S.tiendas.some(t => t.id === p.tiendaId) ? `<small>${esc(nombreTienda(p.tiendaId))}</small>` : ''}</button>`).join('') +
    (q ? '' : '<button class="enlace" data-habituales>Editar</button>');
}

function filaCompra(i) {
  return `<div class="item${i.comprado ? ' comprado' : ''}">

}

function vistaCompra() {
  const f = S.compraF;

    </section>

      <div class="tiendas-f" role="group" aria-label="Filtrar por tienda">${filtros.map(([k, n]) => `<button data-tienda-f="${k}" aria-pressed="${f === k}">${esc(n)}</button>`).join('')}</div>

async function anadirCompra(nombre, cantidad, tiendaId) {
  nombre = String(nombre || '').trim();
  if (!nombre) return;
  const n = normal(nombre);
  const pendiente = S.compra.find(i => !i.comprado && normal(i.nombre) === n);
  if (pendiente) return avisar(`${pendiente.nombre} ya está en la lista`);
  const ya = S.compra.find(i => i.comprado && normal(i.nombre) === n);
  const datos = { nombre, cantidad: cantidad || '', tiendaId: tiendaId || null, comprado: false };
  (ya ? FB.updateDoc(FB.doc(db, 'compra', ya.id), datos)
      : FB.addDoc(FB.collection(db, 'compra'), { ...datos, creado: FB.serverTimestamp(), creadoPor: S.tablet ? 'tablet' : S.yo })).catch(alError);
  FB.setDoc(FB.doc(db, 'productos', idProducto(nombre)), { nombre, tiendaId: tiendaId || null, veces: FB.increment(1), ultimo: hoy() }, { merge: true }).catch(alError);
}
function anadirDesdeBarra() {
  const nombre = S.compraTexto.trim();
  if (!nombre) { document.getElementById('c-nombre')?.focus(); return; }
  const prod = S.productos.find(p => normal(p.nombre) === normal(nombre));
  const tienda = S.compraTienda || (prod && prod.tiendaId) || '';
  anadirCompra(nombre, S.compraCant.trim(), tienda);
  S.compraTexto = ''; S.compraCant = '';
  pintar();
  document.getElementById('c-nombre')?.focus();
}

function quitarComprados() {
  const xs = S.compra.filter(i => i.comprado);
  if (!xs.length) return;
  const lote = FB.writeBatch(db);
  xs.forEach(i => lote.delete(FB.doc(db, 'compra', i.id)));
  lote.commit().catch(alError);
  const copia = xs.map(({ id, _ts, ...resto }) => [id, resto]);
  avisar(`Quitados ${xs.length} productos comprados`, 'Deshacer', () => {
    const l = FB.writeBatch(db);
    copia.forEach(([id, d]) => l.set(FB.doc(db, 'compra', id), d));
    l.commit().catch(alError);
  });
}

function formularioTiendas() {
  const fila = t => `<div class="fila-edit" data-id="${t ? t.id : ''}">
      <input type="text" value="${esc(t ? t.nombre : '')}" maxlength="30" aria-label="Nombre de la tienda">
      <button type="button" class="icono" data-sube aria-label="Subir">↑</button>

      <button type="button" class="icono" data-quita aria-label="Borrar tienda">✕</button></div>`;
  abrirHoja(`<h3>Tiendas</h3><p class="sub">El orden es el de la lista. Si borras una tienda, sus productos pasan a "Sin tienda".</p>
    <div id="t-lista">${S.tiendas.map(fila).join('')}</div>
    <div class="fila-edit"><input type="text" id="t-nueva" placeholder="Nueva tienda (Mercadona, Lidl…)" maxlength="30"><button type="button" class="btn sec" id="t-anadir">Añadir</button></div>

  const lista = $('#t-lista'), borradas = [];
  lista.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const f = b.closest('.fila-edit');
    if ('sube' in b.dataset && f.previousElementSibling) lista.insertBefore(f, f.previousElementSibling);
    if ('baja' in b.dataset && f.nextElementSibling) lista.insertBefore(f.nextElementSibling, f);
    if ('quita' in b.dataset) { if (f.dataset.id) borradas.push(f.dataset.id); f.remove(); }
  };
  $('#t-anadir').onclick = () => {
    const n = $('#t-nueva').value.trim(); if (!n) return;
    lista.insertAdjacentHTML('beforeend', fila(null));
    lista.lastElementChild.querySelector('input').value = n;
    $('#t-nueva').value = '';
  };
  $('#t-guardar').onclick = () => {
    const pendiente = $('#t-nueva').value.trim();
    if (pendiente) $('#t-anadir').click();

/* =====================================================================
   Películas y series
   Colección pelis { titulo, tipo: peli|serie, descripcion, plataforma, categorias[], puntuacion 0-5,
                     estado: pendiente|viendo|vista, episodios, progreso { episodio, minuto }, creado }
   ajustes/pelis { plataformas[], categorias[] }
   ===================================================================== */
const ESTADOS_PELI = [['pendiente', 'Pendiente'], ['viendo', 'Viendo'], ['vista', 'Vista']];
const nombreEstado = k => (ESTADOS_PELI.find(e => e[0] === k) || ESTADOS_PELI[0])[1];
const estrellasTexto = n => n ? '★'.repeat(n) + `<span class="apagada">${'★'.repeat(5 - n)}</span>` : '';
const listasPelis = () => {
  const a = S.ajustesPelis || AJUSTES_PELIS_INICIALES;
  const usadasP = S.pelis.map(p => p.plataforma).filter(Boolean);
  const usadasC = S.pelis.flatMap(p => p.categorias || []);
  const unico = xs => [...new Set(xs)].sort((x, y) => x.localeCompare(y, 'es'));
  return { plataformas: unico([...(a.plataformas || []), ...usadasP]), categorias: unico([...(a.categorias || []), ...usadasC]) };
};
function progresoTexto(p) {
  const pr = p.progreso || {};
  const ep = parseInt(pr.episodio, 10) || 0, min = parseInt(pr.minuto, 10) || 0;
  if (p.tipo === 'serie') {
    if (!ep && !min) return p.episodios ? `${p.episodios} episodios` : '';
    return `Vamos por el episodio ${ep || 1}${p.episodios ? ` de ${p.episodios}` : ''}${min ? `, minuto ${min}` : ''}`;
  }
  return min ? `Vamos por el minuto ${min}` : '';
}

function filtrarPelis(F, { sinVistas = false } = {}) {
  const q = normal(F.texto);
  let xs = S.pelis.filter(p => {
    if (sinVistas && p.estado === 'vista') return false;
    if (!sinVistas) {
      if (F.estado === 'porver' && p.estado === 'vista') return false;
      if (F.estado === 'viendo' && p.estado !== 'viendo') return false;
      if (F.estado === 'vista' && p.estado !== 'vista') return false;
    }
    if (F.tipo !== 'todo' && (p.tipo || 'peli') !== F.tipo) return false;
    if (F.plataforma !== 'todas' && p.plataforma !== F.plataforma) return false;
    if (F.categoria !== 'todas' && !(p.categorias || []).includes(F.categoria)) return false;
    if (F.puntos === 'sin' && (p.puntuacion || 0) > 0) return false;
    if (/^\d$/.test(F.puntos) && (p.puntuacion || 0) < +F.puntos) return false;
    if (q && !normal(`${p.titulo} ${p.descripcion || ''}`).includes(q)) return false;
    return true;
  });
  const orden = {
    recientes: (a, b) => b._ts - a._ts,
    titulo: (a, b) => a.titulo.localeCompare(b.titulo, 'es'),
    puntuacion: (a, b) => (b.puntuacion || 0) - (a.puntuacion || 0) || a.titulo.localeCompare(b.titulo, 'es')
  }[F.orden] || ((a, b) => b._ts - a._ts);
  return xs.sort(orden);
}

function tarjetaPeli(p) {
  const prog = progresoTexto(p);
  return `<div class="peli${p.estado === 'vista' ? ' vista' : ''}" data-peli="${p.id}" role="button" tabindex="0">
    <div class="pills"><span class="pill">${p.tipo === 'serie' ? 'Serie' : 'Película'}</span>${p.plataforma ? `<span class="pill plat">${esc(p.plataforma)}</span>` : ''}${p.estado === 'viendo' ? '<span class="pill viendo">Viendo</span>' : ''}${p.estado === 'vista' ? '<span class="pill vista">Vista</span>' : ''}</div>
    <div class="peli-tit">${esc(p.titulo)}</div>
    ${p.puntuacion ? `<div class="estrellas" aria-label="${p.puntuacion} de 5">${estrellasTexto(p.puntuacion)}</div>` : ''}
    ${(p.categorias || []).length ? `<div class="pills">${p.categorias.map(c => `<span class="pill cat">${esc(c)}</span>`).join('')}</div>` : ''}
    ${prog ? `<div class="progreso">${prog}</div>` : ''}
    ${p.descripcion ? `<div class="desc">${esc(p.descripcion)}</div>` : ''}
  </div>`;
}
function listaPelisHTML() {
  const xs = filtrarPelis(S.pelisF);
  if (!S.pelis.length) return '<div class="vacio grande">Aún no hay películas ni series. Añade la primera con el botón amarillo.</div>';
  if (!xs.length) return '<div class="vacio">Nada con estos filtros.</div>';
  return `<p class="nota" style="margin:0 0 8px">${xs.length} ${xs.length === 1 ? 'título' : 'títulos'}</p><div class="pelis-grid">${xs.map(tarjetaPeli).join('')}</div>`;
}

function vistaPelis() {
  const F = S.pelisF, L = listasPelis();
  const sel = (k, opciones) => `<select data-pfsel="${k}" aria-label="${k}">${opciones.map(([v, n]) => `<option value="${esc(v)}"${F[k] === v ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  return `<div class="cab-vista"><h1 class="titulo-vista">Películas y series</h1>
      <div class="botones"><button class="btn" data-ruleta style="background:var(--sol);color:#17303A">🎲 Ruleta</button>
      <button class="btn sec" data-ajustes-pelis>Listas</button></div></div>
    <div class="filtros-pelis">
      <input type="text" id="p-buscar" placeholder="Buscar…" value="${esc(F.texto)}" autocomplete="off" aria-label="Buscar">
      ${sel('tipo', [['todo', 'Pelis y series'], ['peli', 'Solo películas'], ['serie', 'Solo series']])}
      ${sel('plataforma', [['todas', 'Todas las plataformas'], ...L.plataformas.map(x => [x, x])])}
      ${sel('categoria', [['todas', 'Todas las categorías'], ...L.categorias.map(x => [x, x])])}
      ${sel('puntos', [['todas', 'Cualquier puntuación'], ['5', '★★★★★'], ['4', '★★★★ o más'], ['3', '★★★ o más'], ['2', '★★ o más'], ['1', '★ o más'], ['sin', 'Sin puntuar']])}
      ${sel('orden', [['recientes', 'Más recientes'], ['titulo', 'Por título'], ['puntuacion', 'Mejor puntuadas']])}
      <div class="seg" role="group" aria-label="Estado">${[['porver', 'Por ver'], ['viendo', 'Viendo'], ['vista', 'Vistas'], ['todas', 'Todas']].map(([k, n]) => `<button data-pfestado="${k}" aria-pressed="${F.estado === k}">${n}</button>`).join('')}</div>
    </div>
    <div id="pelis-lista">${listaPelisHTML()}</div>`;
}

function fichaPeli(p) {
  if (!p) return;
  const pr = p.progreso || {};
  let ep = parseInt(pr.episodio, 10) || 0;
  const serie = p.tipo === 'serie';
  const guardar = (cambios, texto) => {
    FB.updateDoc(FB.doc(db, 'pelis', p.id), cambios).catch(alError);
    if (texto) avisar(texto);
    fichaPeli({ ...p, ...cambios });
  };
  abrirHoja(`<h3>${esc(p.titulo)}</h3>
    <div class="pills" style="margin-bottom:10px"><span class="pill">${serie ? 'Serie' : 'Película'}</span>${p.plataforma ? `<span class="pill plat">${esc(p.plataforma)}</span>` : ''}${(p.categorias || []).map(c => `<span class="pill cat">${esc(c)}</span>`).join('')}</div>
    ${p.descripcion ? `<p style="white-space:pre-wrap;margin:0 0 12px">${esc(p.descripcion)}</p>` : ''}
    <div class="campo"><span class="lbl">Puntuación</span><div class="estrellas-btn" id="pf-estrellas">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n <= (p.puntuacion || 0) ? 'on' : ''}" aria-label="${n} estrellas">★</button>`).join('')}</div></div>
    <div class="campo"><span class="lbl">Estado</span><div class="seg" id="pf-estado">${ESTADOS_PELI.map(([k, n]) => `<button type="button" data-r="${k}" aria-pressed="${(p.estado || 'pendiente') === k}">${n}</button>`).join('')}</div></div>
    <div class="campo" style="background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:12px">
      <span class="lbl">Dónde nos hemos quedado</span>
      ${serie ? `<div class="fila2" style="margin-bottom:8px"><span style="font-weight:700">Episodio</span>
        <div class="contador" style="flex:none"><button type="button" class="icono" id="pf-menos" aria-label="Episodio anterior">−</button><span class="num" id="pf-ep">${ep || 1}</span><button type="button" class="icono" id="pf-mas" aria-label="Episodio siguiente">+</button></div>
        <span class="nota" style="flex:none">${p.episodios ? `de ${p.episodios}` : ''}</span></div>` : ''}
      <div class="fila2"><label for="pf-min" style="font-weight:700;flex:none;margin:0">Minuto</label><input type="number" id="pf-min" min="0" max="999" value="${esc(pr.minuto || '')}" placeholder="0"></div>
      <button class="btn ok ancho" id="pf-guardar" style="margin-top:10px">Guardar dónde nos quedamos</button>
    </div>
    <div class="acciones"><button class="btn sec" data-cerrar>Cerrar</button><button class="btn" id="pf-editar">Editar</button></div>
    <button class="btn peligro ancho" id="pf-borrar" style="margin-top:10px">Borrar</button>`);
  if (!ep) ep = 1;
  $('#pf-estrellas').onclick = e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    const n = +b.dataset.n;
    guardar({ puntuacion: n === p.puntuacion ? 0 : n });
  };
  activarSeg('pf-estado', r => guardar({ estado: r }, `Marcada como ${nombreEstado(r).toLowerCase()}`));
  if (serie) {
    const max = parseInt(p.episodios, 10) || 9999;
    $('#pf-menos').onclick = () => { ep = Math.max(1, ep - 1); $('#pf-ep').textContent = ep; };
    $('#pf-mas').onclick = () => { ep = Math.min(max, ep + 1); $('#pf-ep').textContent = ep; $('#pf-min').value = ''; };
  }
  $('#pf-guardar').onclick = () => {
    const progreso = { episodio: serie ? ep : null, minuto: parseInt($('#pf-min').value, 10) || 0 };
    const cambios = { progreso };
    if ((p.estado || 'pendiente') === 'pendiente') cambios.estado = 'viendo';
    guardar(cambios, 'Guardado dónde os quedasteis');
  };
  $('#pf-editar').onclick = () => formularioPeli(p);
  $('#pf-borrar').onclick = () => {
    if (!confirm(`¿Borrar "${p.titulo}"?`)) return;
    FB.deleteDoc(FB.doc(db, 'pelis', p.id)).catch(alError);
    cerrarHoja();
    avisar('Borrada');
  };
}

function formularioPeli(p) {
  const nueva = !p;
  const v = p || { titulo: '', tipo: 'peli', descripcion: '', plataforma: '', categorias: [], puntuacion: 0, estado: 'pendiente', episodios: null };
  const L = listasPelis();
  let tipo = v.tipo || 'peli', plataforma = v.plataforma || '', cats = [...(v.categorias || [])], puntos = v.puntuacion || 0, estado = v.estado || 'pendiente';
  const todasCats = [...new Set([...L.categorias, ...cats])];
  const chipsPlat = () => L.plataformas.map(x => `<button type="button" class="sug" data-plat="${esc(x)}" aria-pressed="${plataforma === x}" style="${plataforma === x ? 'background:var(--tinta);color:var(--papel)' : ''}">${esc(x)}</button>`).join('');
  const chipsCat = () => todasCats.map(x => `<button type="button" class="sug" data-cat="${esc(x)}" style="${cats.includes(x) ? 'background:var(--tinta);color:var(--papel)' : ''}">${esc(x)}</button>`).join('');
  abrirHoja(`<h3>${nueva ? 'Añadir película o serie' : 'Editar'}</h3>
    <div class="campo"><div class="seg" id="pe-tipo"><button type="button" data-r="peli" aria-pressed="${tipo === 'peli'}">Película</button><button type="button" data-r="serie" aria-pressed="${tipo === 'serie'}">Serie</button></div></div>
    <div class="campo"><label for="pe-titulo">Título</label><input type="text" id="pe-titulo" value="${esc(v.titulo)}" maxlength="100"></div>
    <div class="campo"><label for="pe-desc">Descripción</label><textarea id="pe-desc" maxlength="600" placeholder="De qué va, quién la recomendó…">${esc(v.descripcion || '')}</textarea></div>
    <div class="campo"><span class="lbl">Plataforma</span><div class="sugs" id="pe-plat" style="margin:0">${chipsPlat()}</div>
      <input type="text" id="pe-plat-otra" placeholder="Otra plataforma" maxlength="30" style="margin-top:8px" value="${plataforma && !L.plataformas.includes(plataforma) ? esc(plataforma) : ''}"></div>
    <div class="campo"><span class="lbl">Categorías</span><div class="sugs" id="pe-cats" style="margin:0">${chipsCat()}</div>
      <div class="fila2" style="margin-top:8px"><input type="text" id="pe-cat-nueva" placeholder="Nueva categoría" maxlength="30"><button type="button" class="btn sec" id="pe-cat-anadir" style="flex:none">Añadir</button></div></div>
    <div class="campo${tipo === 'serie' ? '' : ' hidden'}" id="pe-eps-c"><label for="pe-eps">Número de episodios</label><input type="number" id="pe-eps" min="1" max="9999" value="${esc(v.episodios || '')}" placeholder="Opcional"></div>
    <div class="campo"><span class="lbl">Estado</span><div class="seg" id="pe-estado">${ESTADOS_PELI.map(([k, n]) => `<button type="button" data-r="${k}" aria-pressed="${estado === k}">${n}</button>`).join('')}</div></div>
    <div class="campo"><span class="lbl">Puntuación</span><div class="estrellas-btn" id="pe-estrellas">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n <= puntos ? 'on' : ''}" aria-label="${n} estrellas">★</button>`).join('')}</div></div>
    <div class="acciones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="pe-guardar">Guardar</button></div>`);
  activarSeg('pe-tipo', r => { tipo = r; $('#pe-eps-c').classList.toggle('hidden', tipo !== 'serie'); });
  activarSeg('pe-estado', r => { estado = r; });
  $('#pe-plat').onclick = e => {
    const b = e.target.closest('[data-plat]'); if (!b) return;
    plataforma = plataforma === b.dataset.plat ? '' : b.dataset.plat;
    $('#pe-plat-otra').value = '';
    $('#pe-plat').innerHTML = chipsPlat();
  };
  $('#pe-plat-otra').oninput = () => { if ($('#pe-plat-otra').value.trim()) { plataforma = ''; $('#pe-plat').innerHTML = chipsPlat(); } };
  $('#pe-cats').onclick = e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    const c = b.dataset.cat;
    cats = cats.includes(c) ? cats.filter(x => x !== c) : [...cats, c];
    $('#pe-cats').innerHTML = chipsCat();
  };
  $('#pe-cat-anadir').onclick = () => {
    const c = $('#pe-cat-nueva').value.trim(); if (!c) return;
    const existente = todasCats.find(x => normal(x) === normal(c)) || c;
    if (!todasCats.includes(existente)) todasCats.push(existente);
    if (!cats.includes(existente)) cats.push(existente);
    $('#pe-cat-nueva').value = '';
    $('#pe-cats').innerHTML = chipsCat();
  };
  $('#pe-estrellas').onclick = e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    puntos = +b.dataset.n === puntos ? 0 : +b.dataset.n;
    sheet.querySelectorAll('#pe-estrellas button').forEach(x => x.classList.toggle('on', +x.dataset.n <= puntos));
  };
  $('#pe-guardar').onclick = () => {
    const titulo = $('#pe-titulo').value.trim();
    if (!titulo) { $('#pe-titulo').focus(); return avisar('Escribe el título'); }
    if ($('#pe-cat-nueva').value.trim()) $('#pe-cat-anadir').click();
    const otra = $('#pe-plat-otra').value.trim();
    const plat = otra || plataforma;
    const datos = {
      titulo, tipo, descripcion: $('#pe-desc').value.trim(), plataforma: plat, categorias: cats,
      puntuacion: puntos, estado, episodios: tipo === 'serie' ? (parseInt($('#pe-eps').value, 10) || null) : null
    };
    const op = nueva
      ? FB.addDoc(FB.collection(db, 'pelis'), { ...datos, progreso: { episodio: null, minuto: 0 }, creado: FB.serverTimestamp(), creadoPor: S.tablet ? 'tablet' : S.yo })
      : FB.updateDoc(FB.doc(db, 'pelis', p.id), datos);
    op.catch(alError);
    // las plataformas y categorías nuevas quedan guardadas para la próxima vez
    const a = S.ajustesPelis || AJUSTES_PELIS_INICIALES;
    const nuevasP = plat && !(a.plataformas || []).includes(plat) ? [...(a.plataformas || []), plat] : null;
    const nuevasC = cats.filter(c => !(a.categorias || []).includes(c));
    if (nuevasP || nuevasC.length) FB.setDoc(FB.doc(db, 'ajustes', 'pelis'), {
      plataformas: nuevasP || a.plataformas || [], categorias: [...(a.categorias || []), ...nuevasC]
    }, { merge: true }).catch(alError);
    cerrarHoja();
    avisar(nueva ? `${titulo} añadida` : 'Cambios guardados');
  };
  if (nueva) setTimeout(() => $('#pe-titulo')?.focus(), 50);
}
