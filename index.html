/* ---- Ruleta para cuando no sabemos qué ver ---- */
let giroRueda = 0;
function hojaRuleta() {
  const F = { ...S.pelisF, texto: '' };
  let tipo = F.tipo;
  const candidatos = () => filtrarPelis({ ...F, tipo }, { sinVistas: true });
  const dibujar = () => {
    let xs = candidatos();
    const total = xs.length;
    if (xs.length > 24) xs = [...xs].sort(() => Math.random() - 0.5).slice(0, 24);
    const filtrosTxt = [F.plataforma !== 'todas' && F.plataforma, F.categoria !== 'todas' && F.categoria, /^\d$/.test(F.puntos) && `${F.puntos}★ o más`].filter(Boolean).join(', ');
    abrirHoja(`<h3>🎲 ¿Qué vemos?</h3>
      <p class="sub">Entre ${total} ${total === 1 ? 'título' : 'títulos'} sin ver${filtrosTxt ? ` (${esc(filtrosTxt)})` : ''}${total > 24 ? '. En la rueda salen 24 al azar' : ''}.</p>
      <div class="seg" id="ru-tipo" style="margin-bottom:12px">${[['todo', 'Todo'], ['peli', 'Películas'], ['serie', 'Series']].map(([k, n]) => `<button type="button" data-r="${k}" aria-pressed="${tipo === k}">${n}</button>`).join('')}</div>
      ${xs.length >= 2 ? `<div class="rueda"><div class="puntero"></div>${ruedaSVG(xs)}</div>
        <p class="resultado" id="ru-res" aria-live="polite"></p>
        <button class="btn ancho" id="ru-girar" style="background:var(--sol);color:#17303A;font-size:1.1rem">Girar</button>
        <button class="btn sec ancho hidden" id="ru-ver" style="margin-top:8px">Ver ficha</button>`
      : `<div class="vacio">${xs.length === 1 ? `Solo hay una opción: <b>${esc(xs[0].titulo)}</b>.` : 'No hay títulos sin ver con estos filtros.'} Prueba a cambiar los filtros de la pestaña.</div>`}
      <button class="btn sec ancho" data-cerrar style="margin-top:8px">Cerrar</button>`);
    activarSeg('ru-tipo', r => { tipo = r; giroRueda = 0; dibujar(); });
    if (xs.length < 2) return;
    giroRueda = 0;
    let elegida = null;
    $('#ru-girar').onclick = () => {
      const n = xs.length, seg = 360 / n, i = Math.floor(Math.random() * n);
      const objetivo = 360 - (i * seg + seg / 2) + (Math.random() - 0.5) * seg * 0.6;
      giroRueda = giroRueda - (giroRueda % 360) + 360 * 6 + objetivo;
      const g = $('#rueda-g'), lento = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      g.style.transition = lento ? 'transform 4.2s cubic-bezier(.17,.67,.16,1)' : 'none';
      g.style.transform = `rotate(${giroRueda}deg)`;
      $('#ru-res').textContent = '';
      $('#ru-girar').disabled = true;
      $('#ru-ver').classList.add('hidden');
      setTimeout(() => {
        if (!$('#ru-res')) return;
        elegida = xs[i];
        $('#ru-res').textContent = `¡${elegida.titulo}!`;
        $('#ru-girar').disabled = false;
        $('#ru-girar').textContent = 'Girar otra vez';
        $('#ru-ver').classList.remove('hidden');
      }, lento ? 4300 : 50);
    };
    $('#ru-ver').onclick = () => elegida && fichaPeli(elegida);
  };
  dibujar();
}
function ruedaSVG(items) {
  const n = items.length, R = 150, c = 160;
  const colores = ['#A8D5BA', '#F6C89F', '#A7D3E8', '#C9B6E4', '#F4A9A8', '#F9E3A3'];
  let s = '';
  items.forEach((p, i) => {
    const a0 = (i / n) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2;
    const p0 = [c + R * Math.cos(a0), c + R * Math.sin(a0)], p1 = [c + R * Math.cos(a1), c + R * Math.sin(a1)];
    let color = colores[i % colores.length];
    if (i === n - 1 && i % colores.length === 0) color = colores[2]; // que no coincida con el primero
    s += `<path d="M${c} ${c} L${p0[0].toFixed(2)} ${p0[1].toFixed(2)} A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${p1[0].toFixed(2)} ${p1[1].toFixed(2)} Z" fill="${color}" stroke="#fff" stroke-width="2"/>`;
    const ang = ((i + 0.5) / n) * 360 - 90;
    const t = p.titulo.length > 17 ? p.titulo.slice(0, 16) + '…' : p.titulo;
    s += `<text transform="rotate(${ang.toFixed(2)} ${c} ${c}) translate(${c + R - 12} ${c})" text-anchor="end" dominant-baseline="middle" font-size="${n > 16 ? 10 : n > 10 ? 11 : 13}" font-weight="800" fill="#17303A" font-family="Nunito, system-ui, sans-serif">${esc(t)}</text>`;
  });
  return `<svg viewBox="0 0 320 320" class="rueda-svg" role="img" aria-label="Ruleta"><g id="rueda-g" style="transform-origin:160px 160px;transform-box:view-box">${s}<circle cx="${c}" cy="${c}" r="20" fill="#17303A"/><circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#17303A" stroke-width="3"/></g></svg>`;
}

/* ---------- Pintado general ---------- */
const PESTANAS = [['tablon', 'Tablón', I.cal], ['pelis', 'Películas y series', I.peli], ['compra', 'Compra', I.carro]];
function pintar() {
  if (!S.usuario || !S.yo) return;
  const vistas = { tablon: vistaTablon, pelis: vistaPelis, compra: vistaCompra };
  const scroll = window.scrollY;
  // conservar el foco y el cursor del campo en el que se está escribiendo
  const act = document.activeElement;
  const foco = act && app.contains(act) && act.id && 'value' in act
    ? { id: act.id, ini: act.selectionStart, fin: act.selectionEnd } : null;
  const quien = S.tablet ? 'Tablet' : PERSONAS[S.yo].nombre;
  const fab = { tablon: ['data-nueva', 'Añadir tarea o evento'], pelis: ['data-nueva-peli', 'Añadir película o serie'] }[S.vista];
  app.innerHTML = `<header class="top"><div class="marca">${I.tejado}HomePlan<span class="ver">v${VERSION_APP}</span></div>
      <button class="yo" data-cuenta>${quien}</button></header>
    <main>${vistas[S.vista]()}</main>
    ${fab ? `<button class="fab" ${fab[0]} aria-label="${fab[1]}">${I.mas}</button>` : ''}
    <nav class="tabs"><div class="in">${PESTANAS.map(([k, n, ic]) =>
      `<button data-vista="${k}"${S.vista === k ? ' aria-current="page"' : ''}>${ic}<span>${n}</span></button>`).join('')}</div></nav>`;
  if (foco) {
    const el = document.getElementById(foco.id);
    if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(foco.ini, foco.fin); } catch (e) { /* no aplica */ } }
  }
  if (S.irA && S.vista === 'tablon') {
    const destino = document.getElementById('d-' + S.irA);
    S.irA = null;
    if (destino && !anchoTablet.matches) { destino.scrollIntoView({ block: 'start' }); return; }
  }
  window.scrollTo(0, scroll);
}

/* ---------- Eventos de la interfaz ---------- */
const ACCIONES = '[data-cerrar],[data-completar],[data-occ],[data-registro],[data-editar],[data-vista],[data-modo],[data-persona],[data-mover],[data-irhoy],[data-dia],[data-nueva],[data-nuevo-dia],[data-cuenta],[data-todo],' +
  '[data-anadir],[data-sug],[data-habituales],[data-comprar],[data-item],[data-tienda-f],[data-tiendas],[data-quitar-comprados],' +
  '[data-peli],[data-nueva-peli],[data-ruleta],[data-ajustes-pelis],[data-pfestado]';
app.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'c-nombre') { S.compraTexto = e.target.value; document.getElementById('sugerencias').innerHTML = sugerenciasHTML(S.compraTexto); }
  else if (id === 'c-cant') S.compraCant = e.target.value;
  else if (id === 'p-buscar') { S.pelisF.texto = e.target.value; document.getElementById('pelis-lista').innerHTML = listaPelisHTML(); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'c-tienda') S.compraTienda = e.target.value;
  else if (e.target.dataset.pfsel) { S.pelisF[e.target.dataset.pfsel] = e.target.value; pintar(); }
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'c-nombre' || e.target.id === 'c-cant')) { e.preventDefault(); anadirDesdeBarra(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.peli) { e.preventDefault(); fichaPeli(S.pelis.find(p => p.id === e.target.dataset.peli)); }
});
document.addEventListener('click', e => {
  ultimaInteraccion = Date.now();
  if (e.target === sheet) return cerrarHoja();
  const el = e.target.closest(ACCIONES);
  if (!el || !(app.contains(el) || sheet.contains(el))) return;
  const d = el.dataset;
  if ('cerrar' in d) return cerrarHoja();
  if (d.completar) { const t = buscar(d.completar); return t && hojaCompletar(t, el.classList.contains('check') ? el : null); }
  if (d.occ) return fichaOcurrencia(buscar(d.occ), d.orig);
  if (d.registro) return formularioRegistro(S.registro.find(r => r.id === d.registro));
  if (d.editar) return formularioElemento(buscar(d.editar));
  if (d.vista) { S.vista = d.vista; window.scrollTo(0, 0); return pintar(); }
  if (d.modo) { S.cal.modo = d.modo; return pintar(); }
  if (d.persona) { S.cal.persona = d.persona; return pintar(); }
  if ('irhoy' in d) { S.cal.fecha = hoy(); S.irA = hoy(); return pintar(); }
  if (d.dia) { S.cal.fecha = d.dia; S.cal.modo = 'semana'; S.irA = d.dia; window.scrollTo(0, 0); return pintar(); }
  if ('nueva' in d) return formularioElemento(null);
  if (d.nuevoDia) return formularioElemento(null, d.nuevoDia);
  if ('cuenta' in d) return menuCuenta();
  if ('todo' in d) return hojaTodo();
  // compra
  if ('anadir' in d) return anadirDesdeBarra();
  if (d.sug) { const pr = S.productos.find(x => x.id === d.sug); if (pr) { anadirCompra(pr.nombre, '', pr.tiendaId || S.compraTienda || ''); S.compraTexto = ''; pintar(); } return; }
  if ('habituales' in d) return formularioHabituales();
  if (d.comprar) { const i = S.compra.find(x => x.id === d.comprar); if (i) FB.updateDoc(FB.doc(db, 'compra', i.id), { comprado: !i.comprado }).catch(alError); return; }
  if (d.item) return formularioItem(S.compra.find(x => x.id === d.item));
  if (d.tiendaF) { S.compraF = d.tiendaF; if (d.tiendaF !== 'todas') S.compraTienda = d.tiendaF === 'sin' ? '' : d.tiendaF; return pintar(); }
  if ('tiendas' in d) return formularioTiendas();
  if ('quitarComprados' in d) return quitarComprados();
  // películas y series
  if (d.peli) return fichaPeli(S.pelis.find(x => x.id === d.peli));
  if ('nuevaPeli' in d) return formularioPeli(null);
  if ('ruleta' in d) return hojaRuleta();
  if ('ajustesPelis' in d) return formularioListasPelis();
  if (d.pfestado) { S.pelisF.estado = d.pfestado; return pintar(); }
  if (d.mover) {
    const n = parseInt(d.mover, 10), c = S.cal;
    c.fecha = c.modo === 'semana' ? sumarDias(c.fecha, 7 * n) : sumarMeses(c.fecha, n);
    return pintar();
  }
});
const buscar = id => S.tareas.find(t => t.id === id);

/* ---------- Aviso con deshacer ---------- */
let temporizadorAviso = null;
function avisar(texto, accion, alPulsar) {
  clearTimeout(temporizadorAviso);
  toastEl.innerHTML = `<span>${esc(texto)}</span>${accion ? `<button>${esc(accion)}</button>` : ''}`;
  toastEl.classList.remove('hidden');
  if (accion) toastEl.querySelector('button').onclick = () => { alPulsar(); toastEl.classList.add('hidden'); };
  temporizadorAviso = setTimeout(() => toastEl.classList.add('hidden'), 7000);
}

/* ---------- Hojas inferiores ---------- */
function abrirHoja(html) {
  sheet.innerHTML = `<div class="panel">${html}</div>`;
  sheet.classList.remove('hidden');
  sheet.querySelector('.panel').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function cerrarHoja() { sheet.classList.add('hidden'); sheet.innerHTML = ''; document.body.style.overflow = ''; }
const $ = s => sheet.querySelector(s);
const segQuien = (id, sel, conAlternar) => `<div class="seg" id="${id}">${[['ivan', 'Iván'], ['jen', 'Jen'], ['ambos', 'Los dos'], ...(conAlternar ? [['alternar', 'Alternar']] : [])]
  .map(([k, n]) => `<button type="button" data-r="${k}" aria-pressed="${sel === k}">${n}</button>`).join('')}</div>`;
function activarSeg(id, alCambiar) {
  $('#' + id).onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    sheet.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute('aria-pressed', x === b));
    alCambiar(b.dataset.r);
  };
}

/* ---- Marcar una tarea como hecha ---- */
function hojaCompletar(t, boton) {
  const o = ocurrenciaActual(t);
  if (!o) return;
  const d = datosOcc(o);
  const orden = S.tablet ? ['ivan', 'jen', 'ambos'] : [S.yo, otro(S.yo), 'ambos'];
  abrirHoja(`<h3>${esc(d.nombre)}</h3>
    <p class="sub">${o.fecha < hoy() ? `<span class="rojo">Tocaba ${fechaRelativa(o.fecha)}</span>` : `Toca ${fechaRelativa(o.fecha)}`}${horaTexto(d) ? ' · ' + horaTexto(d) : ''}</p>
    <div class="campo"><label for="c-fecha">Día en que se hizo</label><input type="date" id="c-fecha" value="${hoy()}" max="${hoy()}"></div>
    ${repite(t) ? '<div class="campo"><span class="lbl">La próxima vez</span><div class="opciones" id="c-modo"></div></div>' : ''}
    <span class="lbl">¿Quién la ha hecho?</span>
    <div class="quien-btns">${orden.map(k => `<button class="btn bq-${k}" data-q="${k}">${nombreQuien(k)}</button>`).join('')}</div>
    <button class="btn sec ancho" data-cerrar>Cancelar</button>`);
  let modo = 'hoy';
  const pintarModo = () => {
    const cont = $('#c-modo'); if (!cont) return;
    const f = $('#c-fecha').value || hoy();
    const a = siguienteFecha(t, f, 'hoy'), b = siguienteFecha(t, f, 'calendario');
    const txt = x => x ? fechaLarga(x) : 'Ya no se repite más';
    if (a === b) { modo = 'hoy'; cont.innerHTML = `<p style="margin:0;font-weight:800">${txt(a)}</p>`; return; }
    cont.innerHTML = `<button type="button" class="opcion" data-m="hoy" aria-pressed="${modo === 'hoy'}">Contar desde ${f === hoy() ? 'hoy' : 'el ' + fechaCorta(f)}<b>${txt(a)}</b></button>
      <button type="button" class="opcion" data-m="calendario" aria-pressed="${modo === 'calendario'}">Mantener el calendario<b>${txt(b)}</b></button>`;
  };
  pintarModo();
  $('#c-fecha').onchange = pintarModo;
  if ($('#c-modo')) $('#c-modo').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { modo = b.dataset.m; pintarModo(); } };
  sheet.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const fecha = $('#c-fecha').value;
    if (!fecha || fecha > hoy()) { $('#c-fecha').focus(); return avisar('Elige hoy o un día anterior'); }
    cerrarHoja();
    completar(t, boton, fecha, b.dataset.q, modo);
  });
}

function completar(t, boton, fecha, hechaPor, modo) {
  const o = ocurrenciaActual(t);
  if (!o) return;
  const d = datosOcc(o);
  if (boton) boton.classList.add('lleno', 'pop');
  const lote = FB.writeBatch(db);
  const refReg = FB.doc(FB.collection(db, 'registro'));
  lote.set(refReg, {
    tareaId: t.id, nombre: d.nombre, tipo: 'tarea', hechaPor, prevista: o.orig, fecha,
    horaInicio: d.horaInicio || '', horaFin: d.horaFin || '', modo, ts: FB.serverTimestamp()
  });
  const antes = { proxima: t.proxima, activa: t.activa !== false, turno: t.turno || null, excepciones: t.excepciones || {} };
  const cambios = {};
  const sig = siguienteFecha(t, fecha, modo);
  if (!sig) cambios.activa = false;
  else { cambios.proxima = sig; cambios.excepciones = excepcionesDesde(t.excepciones, sig); }
  if (t.responsable === 'alternar') cambios.turno = siguienteTurno(t.turno, hechaPor);
  lote.update(FB.doc(db, 'tareas', t.id), cambios);
  lote.commit().catch(alError);
  avisar(fecha === hoy() ? `${d.nombre}: hecha` : `${d.nombre}: hecha el ${fechaCorta(fecha)}`, 'Deshacer', () => {
    const l = FB.writeBatch(db);
    l.delete(refReg);
    l.update(FB.doc(db, 'tareas', t.id), antes);
    l.commit().catch(alError);
  });
}

/* ---- Ficha de una vez concreta ---- */
function fichaOcurrencia(t, orig) {
  if (!t) return;
  if (!repite(t)) return formularioElemento(t);
  const x = (t.excepciones || {})[orig] || null;
  const actual = tipoDe(t) === 'tarea' && t.activa !== false && orig === t.proxima;
  const o = { t, orig, fecha: (x && x.fecha) || orig, x, actual };
  const d = datosOcc(o);
  const esTarea = tipoDe(t) === 'tarea';
  abrirHoja(`<h3>${esc(d.nombre)}</h3>
    <div class="ficha-meta"><span>${fechaLarga(o.fecha)}</span>${horaTexto(d) ? `<span>${horaTexto(d)}</span>` : ''}<span>${nombreQuien(quienDe(d))}${d.alternado ? ' (turno)' : ''}</span></div>
    <p class="sub">${esTarea ? 'Tarea' : 'Evento'} · ${textoFrecuencia(t.frecuencia, t.hasta)}${x ? ' · <b>este día tiene cambios propios</b>' : ''}</p>
    ${d.notas ? `<p style="white-space:pre-wrap;margin:0 0 10px">${esc(d.notas)}</p>` : ''}
    <div class="pila">
      ${actual ? `<button class="btn ok" id="o-hecha">Marcar como hecha</button>` : ''}
      <button class="btn sec" id="o-editar-dia">Editar solo este día</button>
      <button class="btn sec" id="o-borrar-dia">${actual ? 'Saltar esta vez' : 'Eliminar solo este día'}</button>
      <button class="btn sec" id="o-serie">Editar toda la serie</button>
      <button class="btn sec" data-cerrar>Cerrar</button>
    </div>`);
  if (actual) $('#o-hecha').onclick = () => hojaCompletar(t, null);
  $('#o-editar-dia').onclick = () => formularioDia(t, orig);
  $('#o-serie').onclick = () => formularioElemento(t);
  $('#o-borrar-dia').onclick = () => {
    cerrarHoja();
    if (actual) {
      const antes = { proxima: t.proxima, activa: t.activa !== false, excepciones: t.excepciones || {} };
      const sig = siguienteFecha(t, t.proxima, 'calendario');
      const cambios = sig ? { proxima: sig, excepciones: excepcionesDesde(t.excepciones, sig) } : { activa: false };
      FB.updateDoc(FB.doc(db, 'tareas', t.id), cambios).catch(alError);
      avisar(sig ? `Saltada. Próxima: ${fechaCorta(sig)}` : 'Saltada', 'Deshacer', () => FB.updateDoc(FB.doc(db, 'tareas', t.id), antes).catch(alError));
    } else {
      const antes = t.excepciones || {};
      FB.updateDoc(FB.doc(db, 'tareas', t.id), { excepciones: { ...antes, [orig]: { borrada: true } } }).catch(alError);
      avisar(`Eliminado el ${fechaCorta(o.fecha)}`, 'Deshacer', () => FB.updateDoc(FB.doc(db, 'tareas', t.id), { excepciones: antes }).catch(alError));
    }
  };
}

/* ---- Editar solo un día de una serie ---- */
function formularioDia(t, orig) {
  const exc = t.excepciones || {};
  const x = exc[orig] || null;
  const base = datosOcc({ t, orig, x: null, actual: tipoDe(t) === 'tarea' && orig === t.proxima });
  const d = datosOcc({ t, orig, x, actual: tipoDe(t) === 'tarea' && orig === t.proxima });
  let quien = quienDe(d);
  abrirHoja(`<h3>Solo el ${fechaLarga(orig)}</h3>
    <p class="sub">Los cambios afectan únicamente a este día. El resto de la serie sigue igual.</p>
    <div class="campo"><label for="e-nombre">Nombre</label><input type="text" id="e-nombre" value="${esc(d.nombre)}" maxlength="80"></div>
    <div class="campo"><label for="e-fecha">Día</label><input type="date" id="e-fecha" value="${esc((x && x.fecha) || orig)}"></div>
    <div class="campo"><span class="lbl">Hora</span><div class="fila2">
      <input type="time" id="e-hi" value="${esc(d.horaInicio)}" aria-label="Empieza"><span style="flex:none">a</span><input type="time" id="e-hf" value="${esc(d.horaFin)}" aria-label="Termina"></div></div>
    <div class="campo"><span class="lbl">Quién</span>${segQuien('e-quien', quien, false)}</div>
    <div class="campo"><label for="e-notas">Notas</label><textarea id="e-notas">${esc(d.notas)}</textarea></div>
    <div class="acciones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="e-guardar">Guardar este día</button></div>
    ${x ? '<button class="btn sec ancho" id="e-restaurar" style="margin-top:10px">Quitar los cambios de este día</button>' : ''}`);
  activarSeg('e-quien', r => { quien = r; });
  const guardarExc = (nuevo, texto) => {
    const antes = exc;
    FB.updateDoc(FB.doc(db, 'tareas', t.id), { excepciones: nuevo }).catch(alError);
    cerrarHoja();
    avisar(texto, 'Deshacer', () => FB.updateDoc(FB.doc(db, 'tareas', t.id), { excepciones: antes }).catch(alError));
  };
  $('#e-guardar').onclick = () => {
    const ov = {};
    const nombre = $('#e-nombre').value.trim() || base.nombre;
    const fecha = $('#e-fecha').value || orig;
    if (nombre !== base.nombre) ov.nombre = nombre;
    if (fecha !== orig) ov.fecha = fecha;
    if ($('#e-hi').value !== base.horaInicio) ov.horaInicio = $('#e-hi').value;
    if ($('#e-hf').value !== base.horaFin) ov.horaFin = $('#e-hf').value;
    if (quien !== quienDe(base)) ov.responsable = quien;
    if ($('#e-notas').value.trim() !== base.notas) ov.notas = $('#e-notas').value.trim();
    const nuevo = { ...exc };
    if (Object.keys(ov).length) nuevo[orig] = ov; else delete nuevo[orig];
    guardarExc(nuevo, 'Día actualizado');
  };
  if (x) $('#e-restaurar').onclick = () => { const nuevo = { ...exc }; delete nuevo[orig]; guardarExc(nuevo, 'Este día vuelve a ser como la serie'); };
}

/* ---- Crear o editar una tarea / evento (toda la serie) ---- */
function formularioElemento(t, fechaInicial) {
  const nuevo = !t;
  const v = t || { tipo: 'tarea', nombre: '', responsable: S.tablet ? 'ambos' : S.yo, turno: S.tablet ? 'ivan' : S.yo,
    frecuencia: { tipo: 'una', cada: 1 }, proxima: fechaInicial || hoy(), horaInicio: '', horaFin: '', notas: '', activa: true };
  const fr = v.frecuencia || { tipo: 'una', cada: 1 };
  let tipo = tipoDe(v), responsable = v.responsable || 'ambos';
  let dias = esMultidia(fr) ? fr.dias.map(Number) : [diaSemana(v.proxima || hoy())];
  abrirHoja(`<h3>${nuevo ? 'Añadir al tablón' : 'Editar toda la serie'}</h3>
    <div class="campo"><div class="seg" id="f-tipo">
      <button type="button" data-r="tarea" aria-pressed="${tipo === 'tarea'}">Tarea (con check)</button>
      <button type="button" data-r="evento" aria-pressed="${tipo === 'evento'}">Evento / cita</button></div></div>
    <div class="campo"><label for="f-nombre">Nombre</label><input type="text" id="f-nombre" value="${esc(v.nombre)}" placeholder="Limpiar ventanas, cita dentista, turno de tarde…" maxlength="80"></div>
    <div class="campo"><span class="lbl">Quién</span>${segQuien('f-resp', responsable, true)}</div>
    <div class="campo${responsable === 'alternar' ? '' : ' hidden'}" id="f-turno-c"><label for="f-turno">Le toca ahora a</label>
      <select id="f-turno"><option value="ivan"${(v.turno || 'ivan') === 'ivan' ? ' selected' : ''}>Iván</option><option value="jen"${v.turno === 'jen' ? ' selected' : ''}>Jen</option></select></div>
    <div class="campo"><label for="f-fecha" id="f-fecha-lbl"></label><input type="date" id="f-fecha" value="${esc(v.proxima || hoy())}"></div>
    <div class="campo"><span class="lbl">Hora (opcional)</span><div class="fila2">
      <input type="time" id="f-hi" value="${esc(v.horaInicio || '')}" aria-label="Empieza"><span style="flex:none">a</span>
      <input type="time" id="f-hf" value="${esc(v.horaFin || '')}" aria-label="Termina">
      <button type="button" class="icono" id="f-sinhora" aria-label="Quitar la hora" style="flex:none">✕</button></div></div>
    <div class="campo"><span class="lbl">Repetir</span>
      <div class="fila2"><select id="f-frec" aria-label="Cada cuánto se repite">
        ${[['una', 'No se repite'], ['dias', 'Por días'], ['semanas', 'Por semanas'], ['meses', 'Por meses'], ['anios', 'Por años']].map(([k, n]) => `<option value="${k}"${(fr.tipo || 'una') === k ? ' selected' : ''}>${n}</option>`).join('')}
      </select><input type="number" id="f-cada" min="1" max="365" value="${esc(cadaDe(fr))}" aria-label="Cada cuántos"></div>
      <div class="chips hidden" id="f-dias" style="margin-top:8px" aria-label="Qué días de la semana">${DIAS_CORTOS.map((n, i) => `<button type="button" class="chip" data-wd="${i}" aria-pressed="${dias.includes(i)}">${n}</button>`).join('')}</div>
      <p id="f-freq-txt" class="nota" style="margin:6px 0 0"></p></div>
    <div class="campo hidden" id="f-hasta-c"><label for="f-hasta">Repetir hasta (opcional)</label><input type="date" id="f-hasta" value="${esc(v.hasta || '')}"></div>
    <div class="campo"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Opcional">${esc(v.notas || '')}</textarea></div>
    ${!nuevo && tipo === 'tarea' && v.activa === false ? '<p class="nota">Esta tarea ya está terminada. Al guardar vuelve a quedar pendiente.</p>' : ''}
    <div class="acciones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="f-guardar">Guardar</button></div>
    ${!nuevo && tipo === 'tarea' && v.activa !== false ? '<button class="btn ok ancho" id="f-hecha" style="margin-top:10px">Marcar como hecha</button>' : ''}
    ${nuevo ? '' : '<button class="btn peligro ancho" id="f-borrar" style="margin-top:10px">Borrar (todas las repeticiones)</button>'}`);

  const refrescar = () => {
    const ft = $('#f-frec').value;
    const rep = ft !== 'una';
    $('#f-cada').classList.toggle('hidden', !rep);
    $('#f-dias').classList.toggle('hidden', ft !== 'semanas');
    $('#f-hasta-c').classList.toggle('hidden', !rep);
    $('#f-turno-c').classList.toggle('hidden', responsable !== 'alternar');
    $('#f-fecha-lbl').textContent = tipo === 'evento' ? (rep ? 'Empieza el' : 'Fecha') : (nuevo ? 'Primera vez' : 'Próxima vez');
    $('#f-freq-txt').textContent = rep ? textoFrecuencia(frecuenciaForm()) : '';
  };
  const frecuenciaForm = () => {
    const ft = $('#f-frec').value;
    const f = { tipo: ft, cada: Math.max(1, parseInt($('#f-cada').value, 10) || 1) };
    if (ft === 'semanas' && dias.length > 1) f.dias = [...dias].sort((a, b) => a - b);
    return f;
  };
  activarSeg('f-tipo', r => { tipo = r; refrescar(); });
  activarSeg('f-resp', r => { responsable = r; refrescar(); });
  $('#f-frec').onchange = refrescar;
  $('#f-cada').oninput = refrescar;
  $('#f-sinhora').onclick = () => { $('#f-hi').value = ''; $('#f-hf').value = ''; };
  $('#f-fecha').onchange = () => {
    // Si solo hay un día marcado, que siga al día de la fecha elegida
    if (dias.length === 1 && $('#f-fecha').value) {
      dias = [diaSemana($('#f-fecha').value)];
      sheet.querySelectorAll('#f-dias .chip').forEach(c => c.setAttribute('aria-pressed', dias.includes(+c.dataset.wd)));
      refrescar();
    }
  };
  $('#f-dias').onclick = e => {
    const c = e.target.closest('[data-wd]'); if (!c) return;
    const i = +c.dataset.wd;
    if (dias.includes(i)) { if (dias.length === 1) return; dias = dias.filter(x => x !== i); } else dias.push(i);
    c.setAttribute('aria-pressed', dias.includes(i));
    refrescar();
  };
  refrescar();

  $('#f-guardar').onclick = () => {
    const nombre = $('#f-nombre').value.trim();
    if (!nombre) { $('#f-nombre').focus(); return avisar('Escribe un nombre'); }
    let fecha = $('#f-fecha').value || hoy();
    const frecuencia = frecuenciaForm();
    if (frecuencia.tipo === 'semanas') {
      // la fecha se ajusta al primer día marcado a partir de la elegida
      for (let i = 0; i < 7 && !dias.includes(diaSemana(fecha)); i++) fecha = sumarDias(fecha, 1);
    }
    const rep = frecuencia.tipo !== 'una';
    const hasta = rep ? ($('#f-hasta').value || null) : null;
    if (hasta && hasta < fecha) { $('#f-hasta').focus(); return avisar('"Repetir hasta" no puede ser antes del primer día'); }
    const datos = {
      tipo, nombre, responsable, turno: responsable === 'alternar' ? $('#f-turno').value : null,
      frecuencia, proxima: fecha, hasta,
      horaInicio: $('#f-hi').value || '', horaFin: $('#f-hf').value || '',
      notas: $('#f-notas').value.trim(), activa: true
    };
    const op = nuevo
      ? FB.addDoc(FB.collection(db, 'tareas'), { ...datos, excepciones: {}, creadaPor: S.yo, creada: FB.serverTimestamp() })
      : FB.updateDoc(FB.doc(db, 'tareas', t.id), datos);
    op.catch(alError);
    cerrarHoja();
    if (fecha !== S.cal.fecha && (fecha < lunesDe(S.cal.fecha) || fecha > sumarDias(lunesDe(S.cal.fecha), 6)) && S.cal.modo === 'semana') {
      avisar(nuevo ? `Añadido para el ${fechaCorta(fecha)}` : 'Cambios guardados', 'Ver', () => { S.cal.fecha = fecha; S.irA = fecha; pintar(); });
    } else avisar(nuevo ? 'Añadido al tablón' : 'Cambios guardados');
  };
  if ($('#f-hecha')) $('#f-hecha').onclick = () => hojaCompletar(t, null);
  if (!nuevo) $('#f-borrar').onclick = () => {
    if (!confirm(`¿Borrar "${t.nombre}" y todas sus repeticiones? Las veces que ya se hizo siguen en el tablón.`)) return;
    FB.deleteDoc(FB.doc(db, 'tareas', t.id)).catch(alError);
    cerrarHoja();
    avisar('Borrado');
  };
  if (nuevo) setTimeout(() => $('#f-nombre')?.focus(), 50);
}

/* ---- Registro de una tarea hecha ---- */
function esUltimoRegistro(r) {
  return !S.registro.some(x => x.tareaId === r.tareaId && x.id !== r.id &&
    (x.fecha > r.fecha || (x.fecha === r.fecha && x._ts > r._ts)));
}

function formularioRegistro(r) {
  if (!r) return;
  const t = buscar(r.tareaId);
  const ultimo = t && esUltimoRegistro(r);
  abrirHoja(`<h3>${esc(r.nombre)}</h3>
    <p class="sub">Tarea hecha${r.prevista ? `. Tocaba el ${fechaCorta(r.prevista)}` : ''}.</p>
    <div class="campo"><label for="r-fecha">Día en que se hizo</label><input type="date" id="r-fecha" value="${esc(r.fecha)}" max="${hoy()}"></div>
    <div class="campo"><span class="lbl">Quién la hizo</span>${segQuien('r-quien', r.hechaPor, false)}</div>
    ${ultimo ? '<p class="nota">Es la última vez que se hizo esta tarea: si cambias el día, la próxima fecha se recalcula; si eliminas el registro, la tarea vuelve a quedar pendiente.</p>' : ''}
    <div class="acciones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="r-guardar">Guardar</button></div>
    <button class="btn peligro ancho" id="r-borrar" style="margin-top:10px">Eliminar registro</button>
    ${t ? '<button class="btn sec ancho" id="r-tarea" style="margin-top:10px">Editar la tarea</button>' : '<p class="nota" style="margin-top:10px">La tarea original ya no existe.</p>'}`);
  let quien = r.hechaPor;
  activarSeg('r-quien', q => { quien = q; });

  $('#r-guardar').onclick = () => {
    const fecha = $('#r-fecha').value;
    if (!fecha || fecha > hoy()) { $('#r-fecha').focus(); return avisar('Elige hoy o un día anterior'); }
    const lote = FB.writeBatch(db);
    lote.update(FB.doc(db, 'registro', r.id), { fecha, hechaPor: quien });
    if (ultimo) {
      const cambios = {};
      if (repite(t) && fecha !== r.fecha && r.prevista) {
        const sig = siguienteFecha({ ...t, proxima: r.prevista }, fecha, r.modo || 'hoy');
        if (sig) { cambios.proxima = sig; cambios.activa = true; } else cambios.activa = false;
      }
      if (t.responsable === 'alternar' && quien !== r.hechaPor) cambios.turno = siguienteTurno(t.turno, quien);
      if (Object.keys(cambios).length) lote.update(FB.doc(db, 'tareas', t.id), cambios);
    }
    lote.commit().catch(alError);
    cerrarHoja();
    avisar('Registro actualizado');
  };

  $('#r-borrar').onclick = () => {
    if (!confirm(ultimo ? 'Se eliminará el registro y la tarea volverá a quedar pendiente. ¿Seguir?' : '¿Eliminar este registro?')) return;
    const lote = FB.writeBatch(db);
    lote.delete(FB.doc(db, 'registro', r.id));
    if (ultimo) {
      const volver = { activa: true };
      if (r.prevista) volver.proxima = r.prevista;
      if (t.responsable === 'alternar' && r.hechaPor !== 'ambos') volver.turno = r.hechaPor;
      lote.update(FB.doc(db, 'tareas', t.id), volver);
    }
    lote.commit().catch(alError);
    cerrarHoja();
    avisar('Registro eliminado');
  };

  if (t) $('#r-tarea').onclick = () => formularioElemento(t);
}

/* ---- Lista de todo lo que hay en el tablón ---- */
function hojaTodo() {
  const orden = (a, b) => a.nombre.localeCompare(b.nombre, 'es');
  const fila = t => {
    const q = t.responsable === 'alternar' ? (t.turno || 'ivan') : (t.responsable || 'ambos');
    const cuando = tipoDe(t) === 'tarea'
      ? (t.activa === false ? 'Terminada' : `Próxima: ${fechaRelativa(t.proxima)}`)
      : (repite(t) ? `Desde el ${fechaCorta(t.proxima)}` : fechaConDia(t.proxima));
    return `<div class="tarjeta p-${q}${t.activa === false ? ' hecha' : ''}"><div class="info" data-editar="${t.id}">
      <div class="nombre">${esc(t.nombre)}</div>
      <div class="meta"><span class="quien">${t.responsable === 'alternar' ? 'Alternar' : nombreQuien(q)}</span><span>${textoFrecuencia(t.frecuencia, t.hasta)}</span>${horaTexto(t) ? `<span class="hora">${horaTexto(t)}</span>` : ''}<span>${cuando}</span></div></div></div>`;
  };
  const tareas = S.tareas.filter(t => tipoDe(t) === 'tarea' && t.activa !== false).sort(orden);
  const eventos = S.tareas.filter(t => tipoDe(t) === 'evento').sort(orden);
  const fin = S.tareas.filter(t => tipoDe(t) === 'tarea' && t.activa === false).sort(orden);
  const bloque = (titulo, xs) => xs.length ? `<h2>${titulo} <span class="n">${xs.length}</span></h2><div class="lista">${xs.map(fila).join('')}</div>` : '';
  abrirHoja(`<h3>Todo el tablón</h3><p class="sub">Toca uno para editarlo.</p>
    ${bloque('Tareas', tareas)}${bloque('Eventos', eventos)}${bloque('Tareas terminadas', fin)}
    ${S.tareas.length ? '' : '<div class="vacio">Aún no hay nada. Añade lo primero con el botón amarillo.</div>'}
    <button class="btn sec ancho" data-cerrar style="margin-top:16px">Cerrar</button>`);
}

/* ---- Cuenta y modo tablet ---- */
function menuCuenta() {
  abrirHoja(`<h3>Cuenta</h3>
    <p>Has entrado como <strong>${esc(S.usuario.email)}</strong> (${PERSONAS[S.yo].nombre}).</p>
    <div class="interruptor"><div><b>Este dispositivo es la tablet compartida</b>
      <span>Al marcar una tarea siempre pregunta quién la ha hecho, intenta que la pantalla no se apague y, tras ${MINUTOS_VOLVER_A_HOY} minutos sin tocarla, vuelve a la semana actual.</span></div>
      <button class="btn ${S.tablet ? 'ok' : 'sec'}" id="m-tablet">${S.tablet ? 'Sí' : 'No'}</button></div>
    <p class="nota">HomePlan v${VERSION_APP}</p>
    <div class="acciones"><button class="btn sec" data-cerrar>Cerrar</button><button class="btn peligro" id="salir">Cerrar sesión</button></div>`);
  $('#m-tablet').onclick = () => {
    S.tablet = !S.tablet;
    try { localStorage.setItem(CLAVE_TABLET, S.tablet ? '1' : '0'); } catch (e) { /* sin almacenamiento */ }
    if (S.tablet) mantenerPantalla(); else soltarPantalla();
    pintar();
    menuCuenta();
  };
  $('#salir').onclick = () => { cerrarHoja(); FB.signOut(auth); };
}

/* Pantalla siempre encendida en la tablet (si el navegador lo permite) */
let candado = null;
async function mantenerPantalla() {
  if (!S.tablet || document.hidden || !('wakeLock' in navigator) || candado) return;
  try {
    candado = await navigator.wakeLock.request('screen');
    candado.addEventListener('release', () => { candado = null; });
  } catch (e) { console.warn('No se pudo mantener la pantalla encendida', e); candado = null; }
}
async function soltarPantalla() { try { await candado?.release(); } catch (e) { /* nada */ } candado = null; }

/* Reloj, cambio de día y vuelta a la semana actual en la tablet */
let ultimoDia = hoy(), ultimaInteraccion = Date.now();
setInterval(() => {
  const ahora = new Date();
  const reloj = document.getElementById('reloj');
  if (reloj) reloj.textContent = `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`;
  if (hoy() !== ultimoDia) { ultimoDia = hoy(); pintar(); }
  if (S.tablet && sheet.classList.contains('hidden') && Date.now() - ultimaInteraccion > MINUTOS_VOLVER_A_HOY * 60000) {
    const fuera = S.vista !== 'tablon' || S.cal.modo !== 'semana' || lunesDe(S.cal.fecha) !== lunesDe(hoy()) || S.cal.persona !== 'todos';
    if (fuera) { S.vista = 'tablon'; S.cal = { modo: 'semana', fecha: hoy(), persona: 'todos' }; pintar(); window.scrollTo(0, 0); }
    ultimaInteraccion = Date.now();
  }
}, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (hoy() !== ultimoDia) { ultimoDia = hoy(); pintar(); }
  mantenerPantalla();
});
anchoTablet.addEventListener?.('change', () => pintar());

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker no registrado', e)));
}

iniciar();
</script>
